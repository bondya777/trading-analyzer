  profileRows('all'); // 确保 nameMap/tagMap 就绪（供本页与做得怎么样页取账户名）
  const idMap=r.identity&&r.identity.idMap||{};
  const ss=r.styleScores||{};
  const retention=r.fifo&&r.fifo.retention||{};
  const nm=code=>profileState.nameMap&&profileState.nameMap.get(code)||code;
  const scored=[];
  const dist={'交易型':0,'混合型':0,'配置型':0};
  for(const code of Object.keys(idMap)){
    const s=ss[code];
    if(!s||s.score==null)continue;
    dist[s.style]++;
    scored.push({code,name:nm(code),raw:s.raw,score:s.score,style:s.style});
  }
  scored.sort((a,b)=>b.score-a.score);
  const fmt=(v,suf)=>v!=null?v+(suf||''):'-';
  const W=STYLE_CFG.weights,N=STYLE_CFG.norm;
  let html=`<div class="card"><div class="card-header"><div class="card-title">配置型 / 交易型判定（多维打分模型）</div></div><div class="card-body">
    <p style="color:#64748b;font-size:13px;margin-bottom:12px">五个信号加权得分（0-100，越像交易型分越高）：真实换手率（权重${W.turnover*100}%，≥${N.turnoverFull} 满分）· 平均持有天数（${W.hold*100}%，≥${N.holdFull} 天计 0 分）· 期初持仓留存率（${W.retention*100}%，FIFO 口径：卖出先冲期初批）· 交易天数占比（${W.days*100}%，≥${N.daysFull*100}% 满分）· 买卖双向率（${W.both*100}%）。缺失信号跳过、权重自动归一。得分 ≥${STYLE_CFG.tradeMin} = 交易型，≤${STYLE_CFG.configMax} = 配置型，其余混合型。</p>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">交易型</div><div class="stat-value" style="color:#b45309">${dist['交易型']}</div></div>
      <div class="stat-card"><div class="stat-label">混合型</div><div class="stat-value" style="color:#475569">${dist['混合型']}</div></div>
      <div class="stat-card"><div class="stat-label">配置型</div><div class="stat-value" style="color:#166534">${dist['配置型']}</div></div>
      <div class="stat-card"><div class="stat-label">参与判定账户</div><div class="stat-value">${scored.length}</div><div class="stat-sub">信号全无的账户不出判定</div></div>
    </div>
    ${renderPaginatedTable('styleTbl',['排名','账户代码','账户名称','换手率','平均持有(天)','期初留存率%','交易天数占比%','买卖双向率%','得分','判定'],scored.map((a,i)=>[i+1,`<span class="font-mono">${a.code}</span>`,a.name,fmt(a.raw.turnover),fmt(a.raw.avgHold),fmt(a.raw.retention),fmt(a.raw.days),fmt(a.raw.both),`<strong>${a.score}</strong>`,styleBadge(a.style)]),{rowClass:row=>row[9].includes('交易型')?'low-activity-row':'',per:20})}
  </div></div>`;
  if(t&&t.accountTurnover.length>0){
    html+=`<div class="card"><div class="card-header"><div class="card-title">月度换手率分析（回购不计入）</div></div><div class="card-body">
      <p style="color:#64748b;font-size:13px;margin-bottom:12px">口径：现券买卖/基金买卖/国债期货的买入额、卖出额 ÷ 该账户当月平均规模；当月无规模数据的账户不参与该月统计；月均规模 &lt; 0.1 亿的账户不参与 Top10 排名</p>
      ${renderTable(['排名','账户代码','账户名称','月均规模(亿元)','月均买入换手率','月均卖出换手率'],t.accountTurnover.map((a,i)=>[i+1,`<span class="font-mono">${a.code}</span>`,a.name,a.size,a.avgBuy,a.avgSell]))}
      <div class="section-title" style="margin-top:16px">规模档位平均换手率</div>
      ${renderTable(['规模档位','账户数','平均买入换手率','平均卖出换手率'],t.byBucket.map(b=>[b.bucket,b.count,b.avgBuy,b.avgSell]))}
    </div></div>`;
  }
  if(r.lifecycle){
    const lc=r.lifecycle;
    html+=`<div class="card"><div class="card-header"><div class="card-title">账户生命周期</div></div><div class="card-body">
      <div class="stats-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-label">活跃</div><div class="stat-value" style="color:#166534">${lc.counts['活跃']}</div></div>
        <div class="stat-card"><div class="stat-label">新开</div><div class="stat-value" style="color:#1d4ed8">${lc.counts['新开']}</div></div>
        <div class="stat-card"><div class="stat-label">不活跃</div><div class="stat-value" style="color:#92400e">${lc.counts['不活跃']}</div></div>
        <div class="stat-card"><div class="stat-label">疑似关闭</div><div class="stat-value" style="color:#b91c1c">${lc.counts['疑似关闭']}</div></div>
      </div>
      <p style="color:#64748b;font-size:13px;margin-bottom:12px">状态定义：新开 = 首次出现晚于数据期初5个工作日以上；不活跃 = 有持仓但连续10个交易日无交易；疑似关闭 = 持仓数据在期末前10个交易日以上停止更新；其余为活跃</p>
      ${lc.newList.length>0?`<div class="section-title">新开账户（${lc.totals.newTotal} 个）</div>${renderPaginatedTable('lcNew',['账户代码','账户名称','账户归属','首次出现','最新规模(亿元)'],lc.newList.map(a=>[`<span class="font-mono">${a.code}</span>`,a.name,a.belong,a.first,a.size]))}`:''}
      ${lc.inactiveList.length>0?`<div class="section-title">不活跃账户（${lc.totals.inactiveTotal} 个，按规模排序）</div>${renderPaginatedTable('lcInactive',['账户代码','账户名称','账户归属','最后持仓日期','最新规模(亿元)'],lc.inactiveList.map(a=>[`<span class="font-mono">${a.code}</span>`,a.name,a.belong,a.last,a.size]),{rowClass:()=>'low-activity-row'})}`:''}
      ${lc.closedList.length>0?`<div class="section-title">疑似关闭账户（${lc.totals.closedTotal} 个）</div>${renderPaginatedTable('lcClosed',['账户代码','账户名称','账户归属','最后持仓日期','最后规模(亿元)'],lc.closedList.map(a=>[`<span class="font-mono">${a.code}</span>`,a.name,a.belong,a.last,a.size]),{rowClass:()=>'anomaly-row'})}`:''}
    </div></div>`;
  }
  if(r.lowActivity&&r.lowActivity.length>0){
    html+=`<details class="collapsible"><summary>低活跃度账户（交易笔数 ≤ 2，共 ${r.lowActivity.length} 个）</summary><div class="collapsible-body">
      ${renderPaginatedTable('lowact',['账户代码','账户名称','交易笔数','交易总额(亿元)','涉及品种'],r.lowActivity.map(a=>[`<span class="font-mono">${a.code}</span>`,a.name,a.count,Math.round(a.totalAmount*100)/100,a.items.slice(0,5).join(', ')||'-']),{rowClass:()=>'low-activity-row'})}
    </div></details>`;
  }
  return html;
}

function bondSectionsHtml(acct){
  const items=arr=>arr&&arr.length>0?`<div style="margin-top:8px;font-size:12px;color:#64748b;">重仓标的: ${arr.map(x=>`${x.name} ${x.amount.toFixed(2)}亿`).join('、')}</div>`:'';
  let html=`<div class="detail-row" style="margin-bottom:12px;"><span>现券/基金/期货交易笔数: <strong>${acct.totalCount}</strong></span></div>`;
  if(acct.bondCats.length>0){
    html+=`<div class="section-title">债券类别分析</div>`;
    for(const bc of acct.bondCats){
      html+=`<div class="account-detail"><div class="detail-header">${bc.cat}</div><div class="detail-row">
        <span>买入: ${bc.buyAmount.toFixed(2)}亿 (${bc.buyCount}笔)</span>
        <span>卖出: ${bc.sellAmount.toFixed(2)}亿 (${bc.sellCount}笔)</span>
        <span>净额: <span class="${bc.net>=0?'badge badge-green':'badge badge-red'}">${bc.net.toFixed(2)}亿</span></span>
        ${bc.avgTerm!=null?`<span>平均期限: ${bc.avgTerm}年</span>`:''}
      </div>${items(bc.topItems)}</div>`;
    }
  }
  if(acct.fund){html+=`<div class="section-title">基金交易</div><div class="account-detail"><div class="detail-row"><span>买入: ${acct.fund.buyAmount.toFixed(2)}亿 (${acct.fund.buyCount}笔)</span><span>卖出: ${acct.fund.sellAmount.toFixed(2)}亿 (${acct.fund.sellCount}笔)</span></div>${items(acct.fund.topItems)}</div>`}
  if(acct.zq){html+=`<div class="section-title">可转债交易</div><div class="account-detail"><div class="detail-row"><span>买入: ${acct.zq.buyAmount.toFixed(2)}亿 (${acct.zq.buyCount}笔)</span><span>卖出: ${acct.zq.sellAmount.toFixed(2)}亿 (${acct.zq.sellCount}笔)</span></div>${items(acct.zq.topItems)}</div>`}
  if(acct.qh){html+=`<div class="section-title">国债期货交易</div><div class="account-detail"><div class="detail-row"><span>交易笔数: ${acct.qh.count}笔</span><span>交易金额: ${acct.qh.amount.toFixed(2)}亿</span></div>${items(acct.qh.topItems)}</div>`}
  if(acct.abs){html+=`<div class="section-title">ABS 交易</div><div class="account-detail"><div class="detail-row"><span>买入: ${acct.abs.buyAmount.toFixed(2)}亿 (${acct.abs.buyCount}笔)</span><span>卖出: ${acct.abs.sellAmount.toFixed(2)}亿 (${acct.abs.sellCount}笔)</span></div>${items(acct.abs.topItems)}</div>`}
  if(acct.reit){html+=`<div class="section-title">REITs 交易</div><div class="account-detail"><div class="detail-row"><span>买入: ${acct.reit.buyAmount.toFixed(2)}亿 (${acct.reit.buyCount}笔)</span><span>卖出: ${acct.reit.sellAmount.toFixed(2)}亿 (${acct.reit.sellCount}笔)</span></div>${items(acct.reit.topItems)}</div>`}
  return html;
}

function findAccountCandidates(q){
  const r=currentResult;
  if(!r||!r._store)return[];
  const map=new Map();
  const add=(code,name)=>{if(code&&!map.has(code))map.set(code,name||code)};
  for(const rec of r._store.hg)add(toStr(rec._code),toStr(rec._name));
  for(const rec of r._store.zqAll)add(toStr(rec._code),toStr(rec._name));
  for(const rec of r._store.pos)add(toStr(rec._code),toStr(rec._nameSAC));
  const out=[];
  for(const[code,name]of map){if(code.includes(q)||name.includes(q))out.push({code,name})}
  return out.slice(0,20);
}

function accountSearch(){
  const el=document.getElementById('acctSearchInput');
  const box=document.getElementById('acctProfileOut');
  if(!el||!box)return;
  const q=el.value.trim();
  if(!q){box.innerHTML='';return}
  const cands=findAccountCandidates(q);
  if(cands.length===0){box.innerHTML='<div class="empty-state">未找到匹配账户</div>';return}
  if(cands.length===1){showAccountProfile(cands[0].code);return}
  box.innerHTML=`<div class="section-title">匹配到 ${cands.length} 个账户，点击查看：</div>`+cands.map(c=>`<button class="tab" style="margin:0 8px 8px 0;border:1px solid #cbd5e1" onclick="showAccountProfile('${c.code}')"><span class="font-mono">${c.code}</span> ${c.name}</button>`).join('');
}

function buildAccountProfileHtml(code){
  const r=currentResult;
  if(!r||!r._store)return'';
  const hg=r._store.hg.filter(x=>toStr(x._code)===code);
  const zq=r._store.zq.filter(x=>toStr(x._code)===code);
  const posAll=r._store.pos.filter(x=>toStr(x._code)===code).sort((a,b)=>(a._date?a._date.getTime():0)-(b._date?b._date.getTime():0));
  const name=toStr(hg.length?hg[0]._name:'')||toStr(zq.length?zq[0]._name:'')||toStr(posAll.length?posAll[0]._nameSAC:'')||code;
  const belong=posAll.length?(toStr(posAll[0]._belong)||'-'):'-';
  const status=(r.lifecycle&&r.lifecycle.statusByCode&&r.lifecycle.statusByCode[code])||'无持仓数据';
  const hgAmt=hg.reduce((s,x)=>s+x._amountYi,0);
  const hgPos=hg.filter(x=>toStr(x._dir)==='正回购').reduce((s,x)=>s+x._amountYi,0);
  const hgNeg=hg.filter(x=>toStr(x._dir)==='逆回购').reduce((s,x)=>s+x._amountYi,0);
  const last=posAll.length?posAll[posAll.length-1]:null;
  let devHits=0,devMax=0;
  for(const x of r._store.zqAll){
    if(toStr(x._code)!==code||isConvBond(x))continue;
    const mx=Math.max(Math.abs(toNum(x['中债估值偏移度(%)'])*100),Math.abs(toNum(x['中证估值偏移度(%)'])*100));
    if(mx>0.5){devHits++;devMax=Math.max(devMax,mx)}
  }
  const acct=analyzeBondAccount(zq,code,name);
  const tag=profileState.tagMap&&profileState.tagMap.get(code);
  const id=r.identity&&r.identity.idMap?r.identity.idMap[code]:null;
  const ff=r.fifo&&r.fifo.map?r.fifo.map[code]:null;
  // 久期动作：净久期敞口 = Σ买入金额×期限 − Σ卖出金额×期限（亿元·年）
  let buyTerm=0,sellTerm=0;
  const catNet=new Map();
  for(const x of zq){
    const d=toStr(x._dir);
    const c=zqCategory(x);
    if(c&&c!=='其他'&&c!=='期货')catNet.set(c,(catNet.get(c)||0)+((d.includes('买')?1:-1)*x._amountYi));
    if(x._term!=null){
      if(['买入','分销买入'].includes(d))buyTerm+=x._amountYi*x._term;
      else if(['卖出','分销卖出'].includes(d))sellTerm+=x._amountYi*x._term;
    }
  }
  const netDur=buyTerm-sellTerm;
  const durText=Math.abs(netDur)<0.5?'久期基本中性':(netDur>0?`拉久期 +${netDur.toFixed(1)}`:`缩久期 ${netDur.toFixed(1)}`);
  const netText=Array.from(catNet.entries()).filter(([,v])=>Math.abs(v)>=0.5).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).map(([c,v])=>`${c} ${v>0?'+':''}${v.toFixed(1)}亿`).join('、');
  const sid='pf'+(++buildAccountProfileHtml.seq);
  buildAccountProfileHtml.lastSid=sid;
  return`<div class="account-detail" style="margin-top:12px"><div class="detail-header"><span class="font-mono">${code}</span> ${name} ${tag?tagBadge(tag):''} ${id&&id.type?typeBadge(id.type):''} ${id&&id.style?styleBadge(id.style):''}</div>
    <div class="detail-row">
      <span>归属: ${belong}</span>
      <span>生命周期: <strong>${status}</strong></span>
      ${last?`<span>最新规模: ${(last._size/1e8).toFixed(2)}亿</span><span>杠杆率: ${last._lev!=null?(last._lev*100).toFixed(1)+'%':'-'}</span><span>净值: ${last._nav!=null?last._nav.toFixed(4):'-'}</span>`:'<span>无持仓数据</span>'}
    </div></div>
    <div class="grid-2" style="margin-top:12px">
      <div class="account-detail"><div class="detail-header">回购业务</div><div class="detail-row"><span>${hg.length.toLocaleString()} 笔 / ${hgAmt.toFixed(2)}亿</span><span>正回购 ${hgPos.toFixed(2)}亿</span><span>逆回购 ${hgNeg.toFixed(2)}亿</span></div></div>
      <div class="account-detail"><div class="detail-header">估值偏移（已排除转债）</div><div class="detail-row"><span>命中 ${devHits} 笔</span><span>最大偏移 ${devMax.toFixed(2)}%</span></div></div>
    </div>
    <div class="grid-2" style="margin-top:12px">
      <div class="account-detail"><div class="detail-header">交易行为</div><div class="detail-row"><span>久期动作: <strong>${durText}</strong>（亿元·年）</span></div>${netText?`<div style="margin-top:6px;font-size:12px;color:#64748b;">加减仓方向: ${netText}</div>`:''}</div>
      <div class="account-detail"><div class="detail-header">FIFO 交易评价</div><div class="detail-row">${ff?`<span>胜率: <strong>${ff.winRate.toFixed(1)}%</strong></span><span>闭合往返: ${ff.closed} 笔</span><span>平均往返收益: ${ff.avgRet}%</span><span>平均持有: ${ff.avgHold!=null?ff.avgHold+' 天':'-'}</span>`:'<span>闭合往返不足 3 笔，不出胜率</span>'}</div></div>
    </div>
    <div class="grid-2" style="margin-top:12px">
      <div class="account-detail"><div class="detail-header">品种构成（金额，不含回购）</div><div id="${sid}-comp" style="width:100%;height:220px"></div></div>
      <div class="account-detail"><div class="detail-header">月度交易金额（亿元）</div><div id="${sid}-month" style="width:100%;height:220px"></div></div>
    </div>
    ${posAll.length?`<div class="account-detail" style="margin-top:12px"><div class="detail-header">持仓规模 & 杠杆率走势</div><div id="${sid}-pos" style="width:100%;height:220px"></div></div>`:''}
    <div style="margin-top:12px">${bondSectionsHtml(acct)}</div>`;
}
buildAccountProfileHtml.seq=0;

function initProfileCharts(sid,code){
  const r=currentResult;
  if(!r||!r._store)return;
  const compEl=document.getElementById(sid+'-comp');
  if(compEl){
    // 品种构成：只画债券业务部分（不含回购）
    const map=new Map();
    for(const x of r._store.zq){
      if(toStr(x._code)!==code)continue;
      const c=zqCategory(x)||'其他';
      map.set(c,(map.get(c)||0)+x._amountYi);
    }
    const data=Array.from(map.entries()).map(([name,value])=>({name,value:Math.round(value*100)/100})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);
    const chart=echarts.init(compEl);
    chart.setOption({tooltip:{trigger:'item',formatter:'{b}: {c}亿 ({d}%)'},series:[{type:'pie',radius:['35%','65%'],label:{show:true,formatter:'{b} {d}%'},data}]});
  }
  const monthEl=document.getElementById(sid+'-month');
  if(monthEl){
    const mSet=new Set();const hgM=new Map();const zqM=new Map();
    for(const x of r._store.hg){if(toStr(x._code)!==code||!x._month)continue;mSet.add(x._month);hgM.set(x._month,(hgM.get(x._month)||0)+x._amountYi)}
    for(const x of r._store.zq){if(toStr(x._code)!==code||!x._month)continue;mSet.add(x._month);zqM.set(x._month,(zqM.get(x._month)||0)+x._amountYi)}
    const months=Array.from(mSet).sort();
    const chart=echarts.init(monthEl);
    chart.setOption({tooltip:{trigger:'axis'},legend:{data:['回购','现券/基金/期货']},grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:months},yAxis:{type:'value',name:'亿元'},series:[{name:'回购',type:'bar',data:months.map(m=>Math.round((hgM.get(m)||0)*100)/100),color:'#3b82f6'},{name:'现券/基金/期货',type:'bar',data:months.map(m=>Math.round((zqM.get(m)||0)*100)/100),color:'#10b981'}]});
  }
  const posEl=document.getElementById(sid+'-pos');
  if(posEl){
    const rows=r._store.pos.filter(x=>toStr(x._code)===code&&x._dateStr&&x._size>0).sort((a,b)=>(a._date?a._date.getTime():0)-(b._date?b._date.getTime():0));
    const chart=echarts.init(posEl);
    chart.setOption({tooltip:{trigger:'axis'},legend:{data:['规模(亿)','杠杆率(%)']},grid:{left:'3%',right:'6%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:rows.map(x=>x._dateStr)},yAxis:[{type:'value',name:'亿元'},{type:'value',name:'%'}],series:[{name:'规模(亿)',type:'line',data:rows.map(x=>Math.round(x._size/1e8*100)/100),color:'#1d4ed8',smooth:true,connectNulls:true},{name:'杠杆率(%)',type:'line',yAxisIndex:1,data:rows.map(x=>x._lev!=null?Math.round(x._lev*1000)/10:null),color:'#f59e0b',smooth:true,connectNulls:true}]});
  }
}

function showAccountProfile(code){
  const box=document.getElementById('acctProfileOut');
  if(!box)return;
  box.innerHTML=`<div class="section-title">账户完整画像</div>`+buildAccountProfileHtml(code);
  initProfileCharts(buildAccountProfileHtml.lastSid,code);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function compareAccounts(){
  const aEl=document.getElementById('compareInputA');
  const bEl=document.getElementById('compareInputB');
  const outA=document.getElementById('compareA');
  const outB=document.getElementById('compareB');
  if(!aEl||!bEl||!outA||!outB)return;
  const resolve=q=>{
    if(!q)return null;
    const cands=findAccountCandidates(q);
    return cands.length?cands[0].code:null;
  };
  const codeA=resolve(aEl.value.trim());
  outA.innerHTML=codeA?buildAccountProfileHtml(codeA):'<div class="empty-state">账户 A 未找到</div>';
  if(codeA)initProfileCharts(buildAccountProfileHtml.lastSid,codeA);
  const codeB=resolve(bEl.value.trim());
  outB.innerHTML=codeB?buildAccountProfileHtml(codeB):'<div class="empty-state">账户 B 未找到</div>';
  if(codeB)initProfileCharts(buildAccountProfileHtml.lastSid,codeB);
}

function renderEvalTab(r){
  const nm=code=>profileState.nameMap&&profileState.nameMap.get(code)||code;
  let html='';
  // ① FIFO 往返评价（排名以闭合笔数为主）
  if(r.fifo&&r.fifo.accounts.length>0){

        <div><div class="section-title" style="margin-top:0">涨幅 Top10</div>
          ${ph.gainers.length>0?renderTable(['账户代码','账户名称','涨幅','区间'],ph.gainers.map(a=>[`<span class="font-mono">${a.code}</span>`,a.name,`<span class="badge badge-green">+${a.change.toFixed(1)}%</span>`,`${a.first} ~ ${a.last}`])):'<div class="empty-state">暂无数据</div>'}
        </div>
        <div><div class="section-title" style="margin-top:0">跌幅 Top10</div>
          ${ph.losers.length>0?renderTable(['账户代码','账户名称','跌幅','区间'],ph.losers.map(a=>[`<span class="font-mono">${a.code}</span>`,a.name,`<span class="badge badge-red">${a.change.toFixed(1)}%</span>`,`${a.first} ~ ${a.last}`]),{rowClass:()=>'anomaly-row'}):'<div class="empty-state">暂无数据</div>'}
        </div>
      </div>

    if(h.futures.length>0){

      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">

function filterValDetail(){
  const r=currentResult;
  const wrap=document.getElementById('valDetailWrap');
  if(!r||!r.valuation||!wrap)return;
  const qEl=document.getElementById('valQuery');
  const thEl=document.getElementById('valThreshold');
  const q=qEl?qEl.value.trim():'';
  const th=thEl?parseFloat(thEl.value):0.5;
  const rows=(r.valuation.rowsAll||r.valuation.rows).filter(x=>x.mx>=th&&(!q||x.item.includes(q)||x.name.includes(q)||x.code.includes(q)));
  wrap.innerHTML=renderPaginatedTable('valDetail',['日期','账户','标的','方向','金额(亿)','中债偏移','中证偏移','交易员'],
    rows.map(x=>[x.date,`<span class="font-mono">${x.code}</span> ${x.name}`,x.item,x.dir,x.amount,`${x.zd.toFixed(2)}%`,`${x.zz.toFixed(2)}%`,x.trader||'-']),
    {rowClass:row=>{const dev=Math.max(Math.abs(parseFloat(row[5])),Math.abs(parseFloat(row[6])));return dev>1?'anomaly-row':''}});
}

function renderDqTab(r){
  const report=r.dataQuality||[];
  const totalFiltered=report.filter(b=>b.level==='过滤').reduce((s,b)=>s+b.rows.length,0);
  const totalWarn=report.filter(b=>b.level==='提醒').reduce((s,b)=>s+b.rows.length,0);
  let html=`<div class="card"><div class="card-header"><div class="card-title">数据质量与过滤规则 <span class="badge badge-red">已过滤 ${totalFiltered.toLocaleString()} 条</span> <span class="badge badge-amber">提醒 ${totalWarn.toLocaleString()} 条</span></div></div><div class="card-body">
    <p style="color:#64748b;font-size:13px;margin-bottom:12px">以下规则对全量数据生效。命中「过滤」规则的记录已从所有统计、图表、榜单中剔除，仅在本页留痕可追查；命中「提醒」规则的记录仍计入统计。「账户最近规模」指该账户距离交易日最近的一次持仓规模。</p>
    ${renderTable(['过滤规则','级别','命中条数'],DQ_RULES.map(rule=>{const b=report.find(x=>x.rule===rule.id);return[rule.text,rule.level==='过滤'?'<span class="badge badge-red">过滤</span>':'<span class="badge badge-amber">提醒</span>',b?b.rows.length.toLocaleString():0]}))}
  </div></div>`;
  for(const b of report){
    html+=`<details class="collapsible"><summary>${b.text} <span class="badge ${b.level==='过滤'?'badge-red':'badge-amber'}">${b.rows.length.toLocaleString()} 条</span></summary><div class="collapsible-body">
      ${renderPaginatedTable('dq_'+b.rule,['日期','账户代码','账户名称','品种/业务','详情','金额(亿元)'],b.rows.map(x=>[x.date,`<span class="font-mono">${x.code}</span>`,x.name,x.variety,x.detail,x.amount!=null?x.amount:'-']),{rowClass:()=>b.level==='过滤'?'anomaly-row':'low-activity-row'})}
      ${b.rows.length>=5000?`<p style="color:#94a3b8;font-size:12px;margin-top:8px">存储已达 5000 条上限，更多记录请缩小数据范围</p>`:''}
    </div></details>`;
  }
  // 输入侧提示（非过滤规则）
  const info=r.inputInfo||{};
  if(info.salesDropped>0||info.unmapped>0){
    html+=`<div class="card"><div class="card-header"><div class="card-title">输入处理提示</div></div><div class="card-body">
      ${info.salesDropped>0?`<p style="font-size:13px;color:#64748b;margin-bottom:8px">🏷️ 销售户：内部证券账户名称含「销售户」的记录已剔除 <strong>${info.salesDropped.toLocaleString()}</strong> 条（按规则不参与任何分析）</p>`:''}
      ${info.unmapped>0?`<p style="font-size:13px;color:#64748b;margin-bottom:8px">🔎 未识别品种：期末持仓明细中匹配不到、已标为「其他」的交易 <strong>${info.unmapped.toLocaleString()}</strong> 条，涉及代码 ${info.unmappedCodes.length} 个</p>
      <details><summary style="cursor:pointer;font-size:13px;color:#1d4ed8">查看未识别代码清单</summary><p style="font-size:12px;color:#64748b;margin-top:8px;line-height:1.8">${info.unmappedCodes.slice(0,300).join('、')}${info.unmappedCodes.length>300?' …':''}</p></details>`:''}
    </div></div>`;
  }
  // 持仓数据完整性（原持仓规模页模块，属数据质量范畴）
  if(r.posMissingReport&&r.posMissingReport.length>0){
    html+=`<div class="card"><div class="card-header"><div class="card-title">持仓数据完整性分析 <span class="badge badge-amber">${r.posMissingReport.filter(m=>m.isSevere).length} 个账户缺失严重</span></div></div><div class="card-body">
      <p style="color:#64748b;font-size:13px;margin-bottom:12px;">已排除周末和中国节假日（元旦、春节、清明、劳动节、端午节）。缺失比例 ≤30% 的账户已用上一日数据自动填充；缺失比例 >30% 的账户标记为「严重缺失」。</p>
      ${renderPaginatedTable('posMissing',['账户代码','账户名称','应有工作日','缺失天数','缺失比例','严重程度','部分缺失日期'],r.posMissingReport.map(m=>[`<span class="font-mono">${m.code}</span>`,m.name,m.totalWorkdays,m.missingCount,`${(m.missingRate*100).toFixed(1)}%`,m.isSevere?'<span class="badge badge-red">严重缺失</span>':'<span class="badge badge-green">已填充</span>',m.missingDates.join(', ')]),{rowClass:m=>m[5].includes('严重')?'anomaly-row':''})}
    </div></div>`;
  }
  return html;
}

function initCharts(result){
  chartInstances={};
  const trendEl=document.getElementById('chart-trend');
  if(trendEl&&result.monthlyTrend.months.length>0){
    const chart=echarts.init(trendEl);
    chart.setOption({tooltip:{trigger:'axis'},legend:{data:['回购','债券','基金','转债','期货']},grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:result.monthlyTrend.months},yAxis:{type:'value',name:'亿元'},series:[{name:'回购',type:'line',data:result.monthlyTrend.trend.map(t=>t.hg),smooth:true},{name:'债券',type:'line',data:result.monthlyTrend.trend.map(t=>t.zq),smooth:true},{name:'基金',type:'line',data:result.monthlyTrend.trend.map(t=>t.fund),smooth:true},{name:'转债',type:'line',data:result.monthlyTrend.trend.map(t=>t.zqConv),smooth:true},{name:'期货',type:'line',data:result.monthlyTrend.trend.map(t=>t.qh),smooth:true}]});
    chartInstances['trend']=chart;
  }
  const termEl=document.getElementById('chart-term');
  if(termEl){
    const chart=echarts.init(termEl);
    chart.setOption({tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},legend:{data:['买入','卖出']},grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:result.termStructure.map(t=>t.bucket)},yAxis:{type:'value',name:'亿元'},series:[{name:'买入',type:'bar',data:result.termStructure.map(t=>t.buy)},{name:'卖出',type:'bar',data:result.termStructure.map(t=>t.sell)}]});
    chartInstances['term']=chart;
  }
  const termPieEl=document.getElementById('chart-term-pie');
  if(termPieEl){/* 期限饼图已移除，保留判断防止报错 */}
  const netbuyEl=document.getElementById('chart-netbuy');
  if(netbuyEl&&result.netBuy&&result.netBuy.months.length>0){
    const chart=echarts.init(netbuyEl);
    const colors=['#1d4ed8','#3b82f6','#f59e0b','#8b5cf6','#10b981','#ec4899'];
    chart.setOption({tooltip:{trigger:'axis'},legend:{type:'scroll'},grid:{left:'3%',right:'4%',bottom:'3%',containLabel:true},xAxis:{type:'category',data:result.netBuy.months},yAxis:{type:'value',name:'亿元'},series:result.netBuy.series.map((s,i)=>({name:s.name,type:'line',data:s.data,smooth:true,color:colors[i%colors.length]}))});
    chartInstances['netbuy']=chart;
  }
  const sizeDistEl=document.getElementById('chart-size-dist');

const pendingFiles={flow:[],pos:[],hdStart:[],hdEnd:[]};
let activeSlot=null;
document.querySelectorAll('.upload-slot').forEach(slot=>{
  slot.addEventListener('click',()=>{activeSlot=slot.dataset.slot;document.getElementById('fileInput').click()});
  slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('dragover')});
  slot.addEventListener('dragleave',()=>slot.classList.remove('dragover'));
  slot.addEventListener('drop',e=>{e.preventDefault();slot.classList.remove('dragover');if(e.dataTransfer.files.length>0)assignFiles(slot.dataset.slot,e.dataTransfer.files)});
});
document.getElementById('fileInput').addEventListener('change',e=>{
  if(e.target.files.length>0&&activeSlot)assignFiles(activeSlot,e.target.files);
  e.target.value='';
});
function assignFiles(slot,fileList){
  pendingFiles[slot]=Array.from(fileList);
  const el=document.querySelector(`.upload-slot[data-slot="${slot}"]`);
  el.classList.add('filled');
  const totalMB=pendingFiles[slot].reduce((s,f)=>s+f.size,0)/1048576;
  const names=pendingFiles[slot].map(f=>f.name);
  el.querySelector('.slot-status').textContent=pendingFiles[slot].length>1?`${pendingFiles[slot].length} 个文件（共 ${totalMB.toFixed(1)}MB）`:`${names[0]}（${totalMB.toFixed(1)}MB）`;
  el.title=names.join('\n');
  checkReady();
}
function checkReady(){
  const btn=document.getElementById('startBtn');
  const missing=[];
  if(!pendingFiles.flow.length)missing.push('交易流水');
  if(!pendingFiles.hdStart.length)missing.push('期初持仓明细');
  if(!pendingFiles.hdEnd.length)missing.push('期末持仓明细');
  if(missing.length===0){
    btn.disabled=false;btn.classList.add('ready');
    btn.textContent=pendingFiles.pos.length?'开始分析':'开始分析（未单独上传持仓规模，将尝试从流水文件读取）';
  }else{
    btn.disabled=true;btn.classList.remove('ready');
    btn.textContent='请先上传：'+missing.join('、');
  }
}
document.getElementById('startBtn').addEventListener('click',async()=>{
  const loading=document.getElementById('loadingArea');
  const loadingText=document.getElementById('loadingText');
  const errorArea=document.getElementById('errorArea');
  const resultArea=document.getElementById('resultArea');
  const setLoading=t=>{if(loadingText)loadingText.textContent=t};
  const tick=()=>new Promise(res=>setTimeout(res,30));
  loading.style.display='block';
  errorArea.style.display='none';
  resultArea.style.display='none';
  try{
    const mergeHg=[],mergeZq=[],mergePos=[];
    let salesDropped=0;
    const n=Math.max(pendingFiles.flow.length,pendingFiles.pos.length);
    for(let i=0;i<n;i++){
      if(i<pendingFiles.flow.length){
        setLoading(`正在解析交易流水 ${i+1}/${pendingFiles.flow.length}（${pendingFiles.flow[i].name}）…`);
        await tick();
        const f=parseFlowWb(await readWb(pendingFiles.flow[i]));
        mergeHg.push(...f.hgRaw);mergeZq.push(...f.zqRaw);
        if(f.posRaw.length)mergePos.push(...f.posRaw);
        salesDropped+=f.salesDropped;
      }
      if(i<pendingFiles.pos.length){
        setLoading(`正在解析持仓规模 ${i+1}/${pendingFiles.pos.length}…`);
        await tick();
        mergePos.push(...parsePosWb(await readWb(pendingFiles.pos[i])));
      }
    }
    if(!mergeHg.length&&!mergeZq.length)throw new Error('交易流水文件解析为空，请确认文件格式');
    setLoading('正在解析期初持仓明细…');
    await tick();
    const hdStart=parseHoldingsWb(await readWb(pendingFiles.hdStart[0]),pendingFiles.hdStart[0].name);
    setLoading('正在解析期末持仓明细…');
    await tick();
    const hdEnd=parseHoldingsWb(await readWb(pendingFiles.hdEnd[0]),pendingFiles.hdEnd[0].name);
    setLoading(`解析完成（回购 ${mergeHg.length.toLocaleString()} / 债券 ${mergeZq.length.toLocaleString()} / 持仓 ${mergePos.length.toLocaleString()} 行），正在执行数据质量检查与分析…`);
    await tick();
    const result=runAnalysis(mergeHg,mergeZq,mergePos,hdStart,hdEnd,salesDropped);
    currentResult=result;
    setLoading('正在渲染图表…');
    await tick();
    renderSummary(result.summary);
    createTabs();
    renderAllTabs(result);
    resultArea.style.display='block';
  }catch(err){
    console.error(err);
    errorArea.innerHTML=`<div class="error"><strong>分析失败：</strong>${err.message||'未知错误'}</div>`;
    errorArea.style.display='block';
  }finally{
    loading.style.display='none';
  }
});

window.addEventListener('resize',()=>{Object.values(chartInstances).forEach(chart=>chart&&chart.resize())});
</script>
