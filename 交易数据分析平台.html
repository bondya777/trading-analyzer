<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>交易数据分析平台</title>
<script src="https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{background:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);color:white;padding:24px;border-radius:12px;margin-bottom:20px}
header h1{font-size:24px;font-weight:700}header p{font-size:14px;opacity:.9;margin-top:4px}
.upload-area{background:white;border:2px dashed #cbd5e1;border-radius:12px;padding:48px;text-align:center;margin-bottom:20px;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:#3b82f6;background:#eff6ff}
.upload-area.dragover{border-color:#3b82f6;background:#eff6ff}
.upload-icon{font-size:48px;margin-bottom:12px}
.upload-text{font-size:16px;color:#475569;font-weight:500}
.upload-hint{font-size:13px;color:#94a3b8;margin-top:8px}
#fileInput{display:none}
.loading{text-align:center;padding:40px}
.loading-spinner{width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:16px;border-radius:8px;margin-bottom:20px}
.tabs{display:flex;gap:4px;background:white;padding:8px;border-radius:8px;margin-bottom:20px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab{padding:10px 16px;border:none;background:transparent;color:#64748b;font-size:14px;font-weight:500;cursor:pointer;border-radius:6px;white-space:nowrap;transition:all .2s}
.tab:hover{background:#f1f5f9;color:#334155}
.tab.active{background:#3b82f6;color:white}
.tab-content{display:none}.tab-content.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:white;padding:20px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat-label{font-size:12px;color:#64748b;margin-bottom:4px}
.stat-value{font-size:24px;font-weight:700;color:#1e293b}
.stat-sub{font-size:12px;color:#94a3b8;margin-top:4px}
.card{background:white;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:20px;overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid #f1f5f9}
.card-title{font-size:16px;font-weight:600;color:#1e293b}
.card-body{padding:20px}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;padding:12px;text-align:left;font-weight:600;color:#475569;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f1f5f9}
tr:hover{background:#f8fafc}
.text-right{text-align:right}
.font-mono{font-family:"SF Mono",Monaco,"Cascadia Code",monospace;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#dcfce7;color:#166534}
.badge-amber{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#b91c1c}
.badge-gray{background:#f1f5f9;color:#64748b}
.chart{width:100%;height:300px}
.chart-large{width:100%;height:400px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px}
.account-detail{background:#f8fafc;padding:16px;border-radius:8px;margin-bottom:12px}
.detail-header{font-weight:600;margin-bottom:8px}
.detail-row{display:flex;gap:16px;font-size:13px;color:#475569;flex-wrap:wrap}
.anomaly-row{background:#fef2f2!important}
.low-activity-row{background:#fef3c7!important}
.empty-state{text-align:center;padding:60px;color:#94a3b8}
.section-title{font-size:14px;font-weight:600;color:#334155;margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
details.collapsible{background:white;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:20px;overflow:hidden}
details.collapsible>summary{padding:16px 20px;font-size:16px;font-weight:600;color:#1e293b;cursor:pointer;list-style:none;user-select:none}
details.collapsible>summary::-webkit-details-marker{display:none}
details.collapsible>summary::after{content:'▸';float:right;color:#94a3b8}
details.collapsible[open]>summary::after{content:'▾'}
details.collapsible>.collapsible-body{padding:20px;border-top:1px solid #f1f5f9}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:#64748b}
.pager-btns button{padding:4px 10px;margin-left:4px;border:1px solid #cbd5e1;background:white;border-radius:6px;cursor:pointer;font-size:12px;color:#475569}
.pager-btns button.cur{background:#3b82f6;color:white;border-color:#3b82f6}
.pager-btns button:disabled{opacity:.4;cursor:default}
th .th-sort{cursor:pointer;user-select:none}
th .th-sort:hover{color:#1d4ed8}
.upload-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.upload-slot{background:white;border:2px dashed #cbd5e1;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.upload-slot:hover{border-color:#3b82f6;background:#eff6ff}
.upload-slot.filled{border-color:#10b981;border-style:solid;background:#f0fdf4}
.slot-label{font-size:14px;font-weight:600;color:#334155;margin-bottom:6px}
.slot-status{font-size:12px;color:#94a3b8}
.upload-slot.filled .slot-status{color:#166534}
#startBtn{width:100%;padding:16px;font-size:16px;font-weight:600;border:none;border-radius:12px;background:#cbd5e1;color:#64748b;cursor:not-allowed;margin-bottom:20px;transition:all .2s}
#startBtn.ready{background:linear-gradient(135deg,#3b82f6 0%,#1d4ed8 100%);color:white;cursor:pointer}
@media(max-width:768px){.container{padding:12px}.stats-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.tabs{gap:2px}.tab{padding:8px 12px;font-size:12px}}
</style>
</head>
<body>
<div class="container">
<header><h1>交易数据分析平台</h1><p>上传四类数据文件，自动分析回购、债券、基金、持仓规模、持仓明细等多维数据</p></header>
<div class="upload-slots" id="uploadSlots">
  <div class="upload-slot" data-slot="flow">
    <div class="upload-icon">📊</div>
    <div class="slot-label">① 交易流水（必选，可多选/按月分文件）</div>
    <div class="slot-status">原始格式或旧三表精简版；单文件超限时可按月拆分后一起拖入</div>
  </div>
  <div class="upload-slot" data-slot="pos">
    <div class="upload-icon">📈</div>
    <div class="slot-label">② 持仓规模（必选，可多选/按月分文件）</div>
    <div class="slot-status">原始31列或旧7列；多文件自动合并；流水为三表合一时自动填充</div>
  </div>
  <div class="upload-slot" data-slot="hdStart">
    <div class="upload-icon">📅</div>
    <div class="slot-label">③ 持仓明细 · 期初（必选）</div>
    <div class="slot-status">证券余额/非标和基金/国债期货 三子表</div>
  </div>
  <div class="upload-slot" data-slot="hdEnd">
    <div class="upload-icon">📅</div>
    <div class="slot-label">④ 持仓明细 · 期末（必选）</div>
    <div class="slot-status">用于品种精准映射与持仓分析</div>
  </div>
</div>
<input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" multiple>
<button id="startBtn" disabled>请先上传全部 4 个文件</button>
<div id="loadingArea" style="display:none"><div class="loading"><div class="loading-spinner"></div><p id="loadingText" style="color:#64748b">正在分析数据，请稍候...</p></div></div>
<div id="errorArea" style="display:none"></div>
<div id="resultArea" style="display:none">
<div id="summaryBar"></div>
<div class="tabs" id="tabBar"></div>
<div id="tabContents"></div>
</div>
</div>
<script>
function toNum(v){if(typeof v==='number')return v;if(typeof v==='string'){const n=parseFloat(v.replace(/,/g,''));return isNaN(n)?0:n}return 0}
function minMaxTime(dates){let mn=Infinity,mx=-Infinity;for(const d of dates){if(!d)continue;const t=d.getTime();if(t<mn)mn=t;if(t>mx)mx=t}return mn===Infinity?[null,null]:[mn,mx]}
function toStr(v){if(v==null)return'';return String(v).trim()}
function parseDate(v){if(v instanceof Date&&!isNaN(v.getTime()))return v;if(typeof v==='number'){const epoch=new Date(Date.UTC(1899,11,30));return new Date(epoch.getTime()+v*86400000)}if(typeof v==='string'){const d=new Date(v);if(!isNaN(d.getTime()))return d;if(/^\d{8}$/.test(v))return new Date(parseInt(v.slice(0,4)),parseInt(v.slice(4,6))-1,parseInt(v.slice(6,8)))}return null}
function getMonthKey(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function fmtDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseTerm(s){if(!s)return null;s=String(s).trim();let m=s.match(/^(\d+)年以上$/);if(m)return parseFloat(m[1])+5;m=s.match(/^(\d+)[\-~](\d+)年$/);if(m)return(parseFloat(m[1])+parseFloat(m[2]))/2;m=s.match(/^(\d+(?:\.\d+)?)年$/);if(m)return parseFloat(m[1]);m=s.match(/^(\d+(?:\.\d+)?)月$/);if(m)return parseFloat(m[1])/12;m=s.match(/^(\d+(?:\.\d+)?)[日天]$/);if(m)return parseFloat(m[1])/365;return null}
function getTermBucket(term){if(term==null)return'未知';if(term<1)return'0-1年';if(term<3)return'1-3年';if(term<5)return'3-5年';if(term<10)return'5-10年';if(term<30)return'10-30年';return'30年+'}
function getSizeBucket(size){const yi=1e8;if(size<yi)return'<1亿';if(size<3*yi)return'1-3亿';if(size<7*yi)return'3-7亿';if(size<15*yi)return'7-15亿';if(size<30*yi)return'15-30亿';return'>30亿'}
function extractMainCode(raw){return toStr(raw).split('-')[0].trim()}
function findDateField(row){const fields=['交易日期','日期','成交日期','交割日期','结算日期','Date','日期.1','报告生成日期'];for(const f of fields){if(row[f]!=null){const d=parseDate(row[f]);if(d)return d}}for(const[k,v]of Object.entries(row)){if(/日期|date/i.test(k)){const d=parseDate(v);if(d)return d}}return null}

const CHINA_HOLIDAYS=new Set(['2026-01-01','2026-02-17','2026-02-18','2026-02-19','2026-02-20','2026-02-21','2026-02-22','2026-02-23','2026-04-04','2026-04-05','2026-04-06','2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05','2026-06-19','2026-06-20','2026-06-21']);
function isChinaWorkday(d){const day=d.getDay();if(day===0||day===6)return false;return !CHINA_HOLIDAYS.has(fmtDate(d))}

// ===== 数据质量规则（数据驱动，仅依赖列名，换数据后自动适用）=====
const TRADE_VARIETIES=new Set(['现券买卖','基金买卖','国债期货']); // 交易量口径：仅这三种品种计入交易量
const CONV_BONDS=new Set(['可转债','可交换债']); // 估值偏移监控排除转债类
function isConvBond(r){if(r._class)return r._class==='转债';return toStr(r._bondType).includes('转债')||toStr(r._cat).includes('转债')||toStr(r._name2).includes('转债')}
const DQ_RULES=[
  {id:'R0',level:'过滤',text:'交易状态非「成交确认」（已撤销/审批通过等非最终成交记录，不进入任何统计）'},
  {id:'R1',level:'过滤',text:'回购：单笔金额 > 账户最近规模 × 1.5'},
  {id:'R2',level:'过滤',text:'现券买卖/基金买卖/国债期货：单笔金额 > 账户最近规模'},
  {id:'R3',level:'过滤',text:'债券：到期收益率 |值| > 10%（疑似单位录错）'},
  {id:'R5',level:'过滤',text:'交易金额 = 0'},
  {id:'R6',level:'过滤',text:'持仓：账户规模 ≤ 0'},
  {id:'R7',level:'过滤',text:'持仓：杠杆率(资产总值÷规模) > 200% 的单日尖刺（连续≥2天视为真实高杠杆，不过滤）'},
  {id:'R1w',level:'提醒',text:'回购：单笔金额 > 账户最近规模 × 1.2 且 ≤ 1.5（仅提醒，不过滤）'},
  {id:'R9',level:'提醒',text:'交易日期为周末/节假日（疑似补录或日期录错，仅提醒）'}
];
function buildScaleLookup(dfPos){
  const map=new Map();
  for(const r of dfPos){
    const code=toStr(r._code);
    if(!code||!r._date||!(r._size>0))continue;
    if(!map.has(code))map.set(code,[]);
    map.get(code).push([r._date.getTime(),r._size]);
  }
  for(const arr of map.values())arr.sort((a,b)=>a[0]-b[0]);
  return map;
}
function nearestScale(scaleMap,code,date){
  const arr=scaleMap.get(code);
  if(!arr||!date)return null;
  const t=date.getTime();
  let lo=0,hi=arr.length-1;
  while(lo<=hi){const mid=(lo+hi)>>1;if(arr[mid][0]===t){lo=mid;break}if(arr[mid][0]<t)lo=mid+1;else hi=mid-1}
  let best=null;
  const cands=[];if(lo<arr.length)cands.push(lo);if(lo>0)cands.push(lo-1);if(cands.length===0&&arr.length>0)cands.push(0);
  for(const c of cands){if(best==null||Math.abs(arr[c][0]-t)<Math.abs(arr[best][0]-t))best=c}
  return best==null?null:arr[best][1];
}
function applyDataQuality(dfHg,dfZq,dfPos){
  const mk=id=>{const rule=DQ_RULES.find(x=>x.id===id);return{rule:id,level:rule.level,text:rule.text,rows:[]}};
  const bR0=mk('R0'),bR1=mk('R1'),bR1w=mk('R1w'),bR2=mk('R2'),bR3=mk('R3'),bR5=mk('R5'),bR9=mk('R9'),bR6=mk('R6'),bR7=mk('R7');
  const addRow=(b,r,detail)=>{if(b.rows.length<5000)b.rows.push({date:r._date?fmtDate(r._date):(r._dateStr||''),code:toStr(r._code),name:toStr(r._name)||toStr(r._nameSAC)||toStr(r._code),variety:toStr(r._biz)||toStr(r._variety)||'持仓',detail,amount:r._amount!=null?Math.round(r._amount/1e8*10000)/10000:null})};
  const scaleMap=buildScaleLookup(dfPos);
  // --- 回购表 ---
  const hgClean=[];
  for(const r of dfHg){
    let filtered=false;
    const stHg=toStr(r['交易状态']);
    if(stHg&&stHg!=='成交确认'){addRow(bR0,r,'交易状态='+stHg);filtered=true}
    if(!filtered&&r._amount===0){addRow(bR5,r,'金额=0');filtered=true}
    if(!filtered){
      const sc=nearestScale(scaleMap,toStr(r._code),r._date);
      if(sc&&sc>0){
        const ratio=r._amount/sc;
        if(ratio>1.5){addRow(bR1,r,`金额${(r._amount/1e8).toFixed(2)}亿 = 规模${(sc/1e8).toFixed(2)}亿的 ${(ratio*100).toFixed(0)}%`);filtered=true}
        else if(ratio>1.2){addRow(bR1w,r,`金额${(r._amount/1e8).toFixed(2)}亿 = 规模${(sc/1e8).toFixed(2)}亿的 ${(ratio*100).toFixed(0)}%`)}
      }
    }
    if(!filtered&&r._date&&!isChinaWorkday(r._date))addRow(bR9,r,'非交易日交易');
    if(!filtered)hgClean.push(r);
  }
  // --- 债券/其他表 ---
  const zqClean=[];
  for(const r of dfZq){
    let filtered=false;
    const stZq=toStr(r['交易状态']);
    if(stZq&&stZq!=='成交确认'){addRow(bR0,r,'交易状态='+stZq);filtered=true}
    if(!filtered&&r._amount===0){addRow(bR5,r,'金额=0');filtered=true}
    const yld=toNum(r['到期收益率(%)']);
    if(!filtered&&Math.abs(yld)>10){addRow(bR3,r,`到期收益率 ${yld.toFixed(2)}%`);filtered=true}
    if(!filtered&&TRADE_VARIETIES.has(toStr(r._variety))){
      const sc=nearestScale(scaleMap,toStr(r._code),r._date);
      if(sc&&sc>0&&r._amount>sc){addRow(bR2,r,`金额${(r._amount/1e8).toFixed(2)}亿 > 规模${(sc/1e8).toFixed(2)}亿`);filtered=true}
    }
    if(!filtered&&r._date&&!isChinaWorkday(r._date))addRow(bR9,r,'非交易日交易');
    if(!filtered)zqClean.push(r);
  }
  // --- 持仓表：先算杠杆率，区分单日尖刺(录错)与连续高杠杆(真实) ---
  const posByCode=new Map();
  for(const r of dfPos){
    if(!(r._size>0)||!r._date)continue;
    r._lev=r._total>0?r._total/r._size:null;
    const code=toStr(r._code);
    if(!posByCode.has(code))posByCode.set(code,[]);
    posByCode.get(code).push(r);
  }
  const spikeRows=new Set();
  const levRedAccounts=[];
  for(const[code,rows]of posByCode){
    rows.sort((a,b)=>a._date-b._date);
    let run=[];let prev=null;
    const flush=()=>{
      if(run.length===1)spikeRows.add(run[0]);
      else if(run.length>=2)levRedAccounts.push({code,name:toStr(run[0]._nameSAC)||code,days:run.length,maxLev:Math.max(...run.map(x=>x._lev)),start:fmtDate(run[0]._date),end:fmtDate(run[run.length-1]._date)});
      run=[];
    };
    for(const r of rows){
      if(r._lev!=null&&r._lev>2){
        if(prev&&(r._date-prev._date)<=4*86400000)run.push(r);
        else{flush();run=[r]}
        prev=r;
      }
    }
    flush();
  }
  const posClean=[];
  for(const r of dfPos){
    if(!(r._size>0)){addRow(bR6,r,`规模 ${(r._size/1e8).toFixed(2)}亿`);continue}
    if(spikeRows.has(r)){addRow(bR7,r,`杠杆率 ${(r._lev*100).toFixed(0)}%（单日尖刺）`);continue}
    posClean.push(r);
  }
  const dqReport=[bR0,bR1,bR2,bR3,bR5,bR6,bR7,bR1w,bR9].filter(b=>b.rows.length>0);
  return{hgClean,zqClean,posClean,dqReport,levRedAccounts,scaleMap};
}

// ===== 多文件解析套件 =====
const FLOW_KEEP=['交易编号','交易状态','交易品种','业务品种','交易日期','交易方向','簿记场所','托管市场','代码','名称','交易面额(万)','交易金额(元)','期限','交易员','到期收益率(%)','全价(元)','内部证券账户名称','内部证券账户代码','中债估值偏移度(%)','清算所估值偏移度(%)','中证估值偏移度(%)'];
function readWb(file){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=e=>res(XLSX.read(new Uint8Array(e.target.result),{type:'array'}));reader.onerror=()=>rej(new Error('文件读取失败: '+file.name));reader.readAsArrayBuffer(file)})}

// 交易流水：自动识别原始格式（双行表头/110列）与旧精简格式；拆分为回购/债券；剔除销售户；宽表裁剪列
function parseFlowWb(wb){
  const out={hgRaw:[],zqRaw:[],posRaw:[],salesDropped:0};
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name];
    if(name.includes('持仓')||name.includes('规模')){
      out.posRaw=XLSX.utils.sheet_to_json(ws,{defval:null});
      continue;
    }
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:null});
    if(aoa.length<2)continue;
    const r1=(aoa[0]||[]).map(x=>String(x||'').trim());
    const isGroup=r1.some(x=>['组合信息','交易要素','首期交易要素','基本交易要素'].includes(x));
    const headers=(isGroup?aoa[1]:aoa[0]).map(h=>String(h||'').trim());
    const dataRows=aoa.slice(isGroup?2:1);
    const idx={};headers.forEach((h,i)=>{if(h&&idx[h]==null)idx[h]=i});
    const wide=headers.length>40;
    const sheetHint=name.includes('回购')?'hg':(name.includes('债券')||name.includes('其他'))?'zq':null;
    for(const arr of dataRows){
      let o;

      }else{
        o={};for(const h of headers){const i=idx[h];if(h&&arr[i]!=null&&arr[i]!=='')o[h]=arr[i]}
      }

}

const RATE_TYPES=new Set(['国债','地方政府债','特种金融债']);
const CONV_TYPES=new Set(['可转债','可交换债']);
const ABS_TYPES=new Set(['专项受益凭证','资产支持票据','资产支持证券','持有型不动产ABS']);
function buildClassMap(hd){
  const bondByCode=new Map(),bondByName=new Map(),fundMap=new Map();
  for(const b of hd.bonds){
    const t=b.bondType;
    let cat=null,group=null;
    if(b.assetType==='资产证券化产品'||ABS_TYPES.has(t)){cat='信用债';group='ABS'}
    else if(CONV_TYPES.has(t)){cat='可转债';group='转债'}
    else if(RATE_TYPES.has(t)){cat='利率债'}
    else if(t){cat='信用债'}
    if(!cat)continue;
    const rec={cat,group,bondType:t};
    if(b.code&&!bondByCode.has(b.code))bondByCode.set(b.code,rec);
    if(b.name&&!bondByName.has(b.name))bondByName.set(b.name,rec);
  }
  for(const f of hd.funds){
    let cls;
    if(f.kind==='REITs')cls='REITs';
    else if(f.kind.includes('ETF')||f.kind.includes('基金'))cls='基金';
    else cls='其他';
    if(f.code&&!fundMap.has(f.code))fundMap.set(f.code,cls);
  }
  return{bondByCode,bondByName,fundMap};
}
function applyClassification(dfZq,cm){
  let unmapped=0;const unmappedSet=new Set();
  for(const r of dfZq){
    const v=toStr(r._variety),b=toStr(r._biz),code=toStr(r['代码']),nm=toStr(r._name2);
    if(v.includes('期货')||b.includes('期货')||/^(TL|TF|TS|T)\d/.test(code)){r._class='期货';continue}
    // ① 期末持仓明细精准映射（债券代码 → 债券名称兜底）
    const hit=cm.bondByCode.get(code)||cm.bondByName.get(nm);
    const fundCls=cm.fundMap.get(code);
    if(fundCls){r._class=fundCls;continue}
    if(hit){
      r._class=hit.group||hit.cat;
      if(!toStr(r._bondType)&&hit.bondType)r._bondType=hit.bondType;
      if(!toStr(r._cat)&&hit.cat)r._cat=hit.cat;
      continue;
    }
    // ② 旧格式自带列（债券类别/债券品种，用户验证过的精确列）
    const bt=toStr(r._bondType);
    if(bt.includes('资产支持')||bt.includes('受益凭证')){r._class='ABS';continue}
    if(bt.toUpperCase().includes('REIT')){r._class='REITs';continue}
    if(bt.includes('转债')||toStr(r._cat).includes('转债')){r._class='转债';continue}
    const oldCat=toStr(r._cat);
    if(oldCat==='利率债'){r._class='利率债';continue}
    if(oldCat==='信用债'){r._class='信用债';continue}
    if(v.includes('基金')||b.includes('基金')){r._class='基金';continue}
    // ③ 标其他
    r._class='其他';unmapped++;if(code)unmappedSet.add(code);
  }
  return{unmapped,unmappedCodes:Array.from(unmappedSet)};
}

function fillPositionGaps(dfPos){
  if(dfPos.length===0)return{filled:[],missingReport:[]};
  const codeMap=new Map();
  for(const r of dfPos){
    const code=toStr(r._code);
    if(!code)continue;
    if(!codeMap.has(code))codeMap.set(code,{name:toStr(r._nameSAC)||code,records:[]});
    codeMap.get(code).records.push(r);
  }
  const filled=[];const missingReport=[];
  for(const[code,info]of codeMap){
    info.records.sort((a,b)=>(a._date?a._date.getTime():0)-(b._date?b._date.getTime():0));
    const firstRecord=info.records[0];
    const firstDate=firstRecord._date;
    if(!firstDate)continue;
    const maxT=Math.max(...info.records.map(r=>r._date?r._date.getTime():firstDate.getTime()));
    const maxD=new Date(maxT);
    const workdays=[];
    const dtmp=new Date(firstDate);
    while(dtmp<=maxD){if(isChinaWorkday(new Date(dtmp)))workdays.push(fmtDate(new Date(dtmp)));dtmp.setDate(dtmp.getDate()+1);}
    const dateMap=new Map();for(const r of info.records){if(r._dateStr)dateMap.set(r._dateStr,r);}
    let missingCount=0;const missingDates=[];let lastValidRecord=null;
    let maxConsecutiveMissing=0;let currentConsecutive=0;
    for(const wd of workdays){
      if(dateMap.has(wd)){lastValidRecord=dateMap.get(wd);filled.push(lastValidRecord);currentConsecutive=0;}
      else{missingCount++;missingDates.push(wd);currentConsecutive++;if(currentConsecutive>maxConsecutiveMissing)maxConsecutiveMissing=currentConsecutive;if(lastValidRecord){filled.push({...lastValidRecord,_dateStr:wd,_date:parseDate(wd),_filled:true});}}
    }
    let status='正常';
    if(maxConsecutiveMissing>10)status='疑似关闭';
    else if(maxConsecutiveMissing>5)status='严重缺失';
    else if(missingCount>0)status='已填充';
    if(missingCount>0){
      missingReport.push({code,name:info.name,missingCount,totalWorkdays:workdays.length,missingRate:workdays.length>0?Math.round(missingCount/workdays.length*10000)/10000:0,maxConsecutiveMissing,missingDates:missingDates.slice(0,10),status,isSevere:maxConsecutiveMissing>5});
    }
  }
  missingReport.sort((a,b)=>b.maxConsecutiveMissing-a.maxConsecutiveMissing);
  return{filled,missingReport};
}

function getTop10(records,groupKey='_code',nameKey='_name',valueKey='_amountYi'){const map=new Map();for(const r of records){const code=toStr(r[groupKey]);const name=toStr(r[nameKey])||code;if(!code)continue;const ex=map.get(code);if(ex){ex.amount+=toNum(r[valueKey]);ex.count+=1}else{map.set(code,{name,amount:toNum(r[valueKey]),count:1})}}const arr=Array.from(map.entries()).map(([code,v])=>({code,name:v.name,amount:Math.round(v.amount*10000)/10000,count:v.count}));const byValue=[...arr].sort((a,b)=>b.amount-a.amount).slice(0,10);const byCount=[...arr].sort((a,b)=>b.count-a.count).slice(0,10);return{byValue,byCount}}
function analyzeBondAccount(dfZq,code,name){
  const acct=dfZq.filter(r=>toStr(r._code)===code);
  const r2=v=>Math.round(v*10000)/10000;
  const topItems=df=>{
    const m=new Map();
    for(const r of df){const n=toStr(r._name2);if(!n)continue;m.set(n,(m.get(n)||0)+r._amountYi)}
    return Array.from(m.entries()).map(([n,amount])=>({name:n,amount:Math.round(amount*100)/100})).sort((a,b)=>b.amount-a.amount).slice(0,3);
  };
  const buySell=df=>{
    const buy=df.filter(r=>['买入','分销买入','期货买入'].includes(toStr(r._dir)));
    const sell=df.filter(r=>['卖出','分销卖出','期货卖出'].includes(toStr(r._dir)));
    return{buyAmount:r2(buy.reduce((s,r)=>s+r._amountYi,0)),buyCount:buy.length,sellAmount:r2(sell.reduce((s,r)=>s+r._amountYi,0)),sellCount:sell.length,net:r2(buy.reduce((s,r)=>s+r._amountYi,0)-sell.reduce((s,r)=>s+r._amountYi,0))};
  };
  const bondCats=[];
  for(const cat of['利率债','信用债']){
    const catDf=acct.filter(r=>toStr(r._cat)===cat&&!isABS(r)&&!isREIT(r));
    if(catDf.length===0)continue;
    const terms=catDf.map(r=>r._term).filter(t=>t!=null);
    const varieties={};
    for(const r of catDf){const v=toStr(r._bondType);if(v&&v!=='nan')varieties[v]=(varieties[v]||0)+1}
    bondCats.push({cat,...buySell(catDf),avgTerm:terms.length>0?Math.round((terms.reduce((a,b)=>a+b,0)/terms.length)*100)/100:null,varieties,topItems:topItems(catDf)});
  }
  let fund=null;
  const fundDf=acct.filter(r=>(toStr(r._biz).includes('基金')||toStr(r._variety).includes('基金'))&&!isREIT(r));
  if(fundDf.length>0)fund={...buySell(fundDf),topItems:topItems(fundDf)};
  let zq=null;
  const zqDf=acct.filter(r=>isConvBond(r));
  if(zqDf.length>0)zq={...buySell(zqDf),topItems:topItems(zqDf)};
  let qh=null;
  const qhDf=acct.filter(r=>toStr(r._biz).includes('期货')||toStr(r._variety).includes('期货'));
  if(qhDf.length>0)qh={count:qhDf.length,amount:r2(qhDf.reduce((s,r)=>s+r._amountYi,0)),topItems:topItems(qhDf)};
  let abs=null;
  const absDf=acct.filter(r=>isABS(r));
  if(absDf.length>0)abs={...buySell(absDf),topItems:topItems(absDf)};
  let reit=null;
  const reitDf=acct.filter(r=>isREIT(r));
  if(reitDf.length>0)reit={...buySell(reitDf),topItems:topItems(reitDf)};
  const totalCount=acct.length;
  return{code,name,totalCount,bondCats,fund,zq,qh,abs,reit};
}

function buildTermStructure(dfZq){
  const buckets=['0-1年','1-3年','3-5年','5-10年','10-30年','30年+','基金'];
  const data=Object.fromEntries(buckets.map(b=>[b,{buy:0,sell:0}]));
  for(const r of dfZq){
    let b=r._termBucket||'未知';
    if(b==='未知'){
      // 「未知」桶只保留基金数据，命名为「基金」；其余无期限标的不进图
      if(toStr(r._biz).includes('基金')||toStr(r._variety).includes('基金'))b='基金';
      else continue;
    }
    if(!data[b])continue;
    if(['买入','分销买入'].includes(toStr(r._dir)))data[b].buy+=r._amountYi;
    else if(['卖出','分销卖出'].includes(toStr(r._dir)))data[b].sell+=r._amountYi;
  }
  return buckets.map(b=>({bucket:b,buy:Math.round(data[b].buy*10000)/10000,sell:Math.round(data[b].sell*10000)/10000,net:Math.round((data[b].buy-data[b].sell)*10000)/10000}));
}

function detectAnomalies(dfAll,scaleMap){
  // 大额占比：单笔金额 ÷ 账户最近规模，Top30（相对规模比绝对金额更能发现异常；规模<1000万的账户不参与，避免小账户比例失真）
  const big=[];
  if(scaleMap){
    for(const r of dfAll){
      const sc=nearestScale(scaleMap,toStr(r._code),r._date);
      if(!sc||sc<1e7||!(r._amount>0))continue;
      const ratio=r._amount/sc;
      big.push({code:toStr(r._code),name:toStr(r._name),biz:toStr(r._biz)||toStr(r._variety)||'未知',dir:toStr(r._dir)||'未知',itemName:toStr(r._name2)||'',amount:Math.round(r._amountYi*10000)/10000,ratio:Math.round(ratio*1000)/10,date:r._month||'',type:'大额占比'});
    }
    big.sort((a,b)=>b.ratio-a.ratio);
  }
  const freqMap=new Map();
  for(const r of dfAll){
    const code=toStr(r._code);const biz=toStr(r._biz)||toStr(r._variety);const month=r._month;
    if(!code||!biz||!month)continue;
    const key=`${code}|${biz}|${month}`;
    const ex=freqMap.get(key);
    if(ex)ex.count++;else freqMap.set(key,{count:1,code,name:toStr(r._name)||code,biz,month});
  }
  const freq=[];
  for(const[,v]of freqMap){if(v.count>=50)freq.push({code:v.code,name:v.name,biz:v.biz,dir:`${v.count}笔`,itemName:'',amount:0,ratio:null,date:v.month,type:'高频率'})}
  freq.sort((a,b)=>b.count-a.count);
  return[...big.slice(0,30),...freq.slice(0,20)];
}

function buildPositionOverview(dfPos,activeCodes){

  }
  const latestMap=new Map();
  for(const r of posFiltered){
    const code=toStr(r._code);
    const ex=latestMap.get(code);
    if(!ex||(r._date&&ex._date&&r._date>ex._date))latestMap.set(code,r);
  }
  const latest=Array.from(latestMap.values());
  const sizes=latest.map(r=>r._size).filter(s=>s>0);
  const navs=latest.map(r=>r._nav).filter(n=>n!=null&&n>0);
  const totals=latest.map(r=>r._total).filter(t=>t>0);
  const avg=arr=>arr.length>0?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const sizeDistMap=new Map();
  for(const r of latest){
    const bucket=getSizeBucket(r._size);

    sizeDistMap.set(bucket,ex);
  }
  const bucketOrder=['<1亿','1-3亿','3-7亿','7-15亿','15-30亿','>30亿'];

  return{hasData:true,summary:{accountCount:latest.length,avgSize:sizes.length>0?Math.round(avg(sizes)/1e8*10000)/10000:0,medSize:sizes.length>0?Math.round((sizes.sort((a,b)=>a-b)[Math.floor(sizes.length/2)]||0)/1e8*10000)/10000:0,maxSize:sizes.length>0?Math.round(Math.max(...sizes,0)/1e8*10000)/10000:0,minSize:sizes.length>0?Math.round(Math.min(...sizes.filter(s=>s>0),Infinity)/1e8*10000)/10000:0,avgNav:navs.length>0?Math.round(avg(navs)*10000)/10000:null,avgTotal:totals.length>0?Math.round(avg(totals)/1e8*10000)/10000:0},sizeDist,dateRange:minDate&&maxDate?`${fmtDate(minDate)} ~ ${fmtDate(maxDate)}`:'',accountCount:latest.length,latest};
}

  const result=[];
  const bucketOrder=['<1亿','1-3亿','3-7亿','7-15亿','15-30亿','>30亿'];
  for(const bucket of bucketOrder){
    const codesInBucket=[];
    for(const[code,r]of latestMap){if(getSizeBucket(r._size)===bucket)codesInBucket.push(code)}
    if(codesInBucket.length===0)continue;
    const zqInBucket=dfZq.filter(r=>codesInBucket.includes(toStr(r._code)));
    const bizMap=new Map();
    for(const r of zqInBucket){
      const biz=toStr(r._biz)||toStr(r._variety)||'其他';
      const ex=bizMap.get(biz)||{amount:0,count:0};
      ex.amount+=r._amountYi;ex.count++;
      bizMap.set(biz,ex);
    }
    const topBiz=Array.from(bizMap.entries()).map(([biz,v])=>({biz,amount:Math.round(v.amount*10000)/10000,count:v.count})).sort((a,b)=>b.amount-a.amount).slice(0,5);
    result.push({bucket,accountCount:codesInBucket.length,totalAmount:Math.round(zqInBucket.reduce((s,r)=>s+r._amountYi,0)*10000)/10000,topBiz});
  }
  return result;
}

function buildPositionAnomalies(dfPos,activeCodes){
  const posFiltered=dfPos.filter(r=>activeCodes.has(toStr(r._code)));
  if(posFiltered.length===0)return[];
  const codeData=new Map();
  for(const r of posFiltered){
    const code=toStr(r._code);
    if(!codeData.has(code))codeData.set(code,[]);
    codeData.get(code).push(r);
  }
  const anomalies=[];
  for(const[code,data]of codeData){
    data.sort((a,b)=>(a._date?a._date.getTime():0)-(b._date?b._date.getTime():0));
    const sizes=data.map(r=>r._size).filter(s=>s>0);
    if(sizes.length<2)continue;
    const maxSize=Math.max(...sizes);const minSize=Math.min(...sizes);
    const avgSize=sizes.reduce((a,b)=>a+b,0)/sizes.length;
    const volatility=avgSize>0?(maxSize-minSize)/avgSize:0;
    const name=toStr(data[0]._nameSAC)||code;
    if(volatility>0.5){
      anomalies.push({code,name,maxSize:Math.round(maxSize/1e8*10000)/10000,minSize:Math.round(minSize/1e8*10000)/10000,avgSize:Math.round(avgSize/1e8*10000)/10000,volatility:Math.round(volatility*10000)/10000,type:'规模大幅波动'});
    }
    const navs=data.map(r=>r._nav).filter(n=>n!=null&&n>0);
    if(navs.length>=2){
      const maxNav=Math.max(...navs);const minNav=Math.min(...navs);
      if(maxNav-minNav>0.5){
        anomalies.push({code,name,maxNav:Math.round(maxNav*10000)/10000,minNav:Math.round(minNav*10000)/10000,type:'净值大幅波动'});
      }
    }
  }
  return anomalies;
}

function buildLowActivity(dfAll){
  const codeCount=new Map();
  for(const r of dfAll){const code=toStr(r._code);if(!code)continue;codeCount.set(code,(codeCount.get(code)||0)+1)}
  const lowActivity=[];
  for(const[code,count]of codeCount){
    if(count<=2){
      const name=toStr(dfAll.find(r=>toStr(r._code)===code)?._name)||code;
      const records=dfAll.filter(r=>toStr(r._code)===code);
      const items=[...new Set(records.map(r=>toStr(r._biz)||toStr(r._variety)||toStr(r._name2)).filter(x=>x&&x!=='nan'))];
      lowActivity.push({code,name,count,items,totalAmount:Math.round(records.reduce((s,r)=>s+r._amountYi,0)*10000)/10000});
    }
  }
  lowActivity.sort((a,b)=>a.count-b.count);
  return lowActivity;
}

function buildTurnoverAnalysis(dfZqTrade,dfPosFilled,activeCodes){
  // 口径：分子=现券买卖/基金买卖/国债期货的买入额、卖出额（分列）；分母=该账户当月全部交易日规模的平均值；当月无规模数据的账户不进入该月统计
  const posFiltered=dfPosFilled.filter(r=>activeCodes.has(toStr(r._code))&&!r._filled&&r._size>0);
  const acctMonthSize=new Map();const nameMap=new Map();
  for(const r of posFiltered){
    const code=toStr(r._code);const m=r._date?getMonthKey(r._date):null;
    if(!code||!m)continue;
    if(!nameMap.has(code))nameMap.set(code,toStr(r._nameSAC)||code);
    if(!acctMonthSize.has(code))acctMonthSize.set(code,new Map());
    const mm=acctMonthSize.get(code);
    const ex=mm.get(m)||{sum:0,cnt:0};
    ex.sum+=r._size;ex.cnt++;mm.set(m,ex);
  }
  const acctMonthTrade=new Map();
  for(const r of dfZqTrade){
    const code=toStr(r._code);const m=r._month;
    if(!code||!m)continue;
    if(!acctMonthTrade.has(code))acctMonthTrade.set(code,new Map());
    const mm=acctMonthTrade.get(code);
    const ex=mm.get(m)||{buy:0,sell:0};
    const dir=toStr(r._dir);
    if(['买入','分销买入','期货买入'].includes(dir))ex.buy+=r._amountYi;
    else if(['卖出','分销卖出','期货卖出'].includes(dir))ex.sell+=r._amountYi;
    mm.set(m,ex);
  }
  const accountTurnover=[];
  for(const[code,mm]of acctMonthTrade){
    const sizes=acctMonthSize.get(code);
    if(!sizes)continue;
    let sumB=0,sumS=0,n=0;
    const monthlyData=[];
    for(const[m,t]of mm){
      const sz=sizes.get(m);
      if(!sz||sz.cnt===0)continue;
      const avgSizeYi=sz.sum/sz.cnt/1e8;
      if(avgSizeYi<=0)continue;
      const tb=t.buy/avgSizeYi,ts=t.sell/avgSizeYi;
      monthlyData.push({month:m,buy:Math.round(t.buy*100)/100,sell:Math.round(t.sell*100)/100,avgSize:Math.round(avgSizeYi*100)/100,tb:Math.round(tb*10000)/10000,ts:Math.round(ts*10000)/10000});
      sumB+=tb;sumS+=ts;n++;
    }
    if(n>0){
      const avgBuy=sumB/n,avgSell=sumS/n;
      const latest=Array.from(sizes.entries()).sort((a,b)=>a[0]<b[0]?1:-1)[0];
      accountTurnover.push({code,name:nameMap.get(code)||code,size:Math.round(latest[1].sum/latest[1].cnt/1e8*100)/100,avgBuy:Math.round(avgBuy*10000)/10000,avgSell:Math.round(avgSell*10000)/10000,avgBoth:Math.round((avgBuy+avgSell)/2*10000)/10000,months:n,monthlyData:monthlyData.sort((a,b)=>a.month<b.month?-1:1)});
    }
  }
  accountTurnover.sort((a,b)=>b.avgBoth-a.avgBoth);
  const bucketAvg=new Map();
  for(const a of accountTurnover){
    const b=getSizeBucket(a.size*1e8);
    const ex=bucketAvg.get(b)||{sumB:0,sumS:0,count:0};
    ex.sumB+=a.avgBuy;ex.sumS+=a.avgSell;ex.count++;
    bucketAvg.set(b,ex);
  }
  const bucketOrder=['<1亿','1-3亿','3-7亿','7-15亿','15-30亿','>30亿'];
  const byBucket=bucketOrder.map(b=>{const v=bucketAvg.get(b);return v?{bucket:b,count:v.count,avgBuy:Math.round(v.sumB/v.count*10000)/10000,avgSell:Math.round(v.sumS/v.count*10000)/10000,avgBoth:Math.round((v.sumB+v.sumS)/2/v.count*10000)/10000}:null}).filter(x=>x&&x.count>0);
  return{accountTurnover:accountTurnover.filter(a=>a.size>=0.1).slice(0,10),byBucket};
}

function buildConcentrationAnalysis(dfZq){
  const codeMap=new Map();
  for(const r of dfZq){
    const code=toStr(r._code);
    if(!code)continue;
    if(!codeMap.has(code))codeMap.set(code,{name:toStr(r._name)||code,varietyMap:new Map(),termMap:new Map(),buyAmount:0,sellAmount:0,totalAmount:0});
    const info=codeMap.get(code);
    const v=toStr(r._biz)||toStr(r._variety)||'其他';
    const ex=info.varietyMap.get(v)||0;
    info.varietyMap.set(v,ex+r._amountYi);
    info.totalAmount+=r._amountYi;
    if(['买入','分销买入'].includes(toStr(r._dir)))info.buyAmount+=r._amountYi;
    else if(['卖出','分销卖出'].includes(toStr(r._dir)))info.sellAmount+=r._amountYi;
    // 期限集中度：剔除期限未知的记录，只统计有期限数据部分
    const t=r._termBucket;
    if(t&&t!=='未知'){
      const tex=info.termMap.get(t)||0;
      info.termMap.set(t,tex+r._amountYi);
      info.termTotal=(info.termTotal||0)+r._amountYi;
    }
  }
  const varietyConc=[];const directionConc=[];const termConc=[];
  for(const[code,info]of codeMap){
    if(info.totalAmount<=0)continue;
    const maxVar=Math.max(...Array.from(info.varietyMap.values()));
    varietyConc.push({code,name:info.name,maxVarietyPct:Math.round(maxVar/info.totalAmount*10000)/10000,topVariety:[...info.varietyMap.entries()].sort((a,b)=>b[1]-a[1])[0][0]});
    const buyPct=info.buyAmount/info.totalAmount;
    const sellPct=info.sellAmount/info.totalAmount;
    if(buyPct>=0.9)directionConc.push({code,name:info.name,type:'只买不卖',buyPct:Math.round(buyPct*10000)/10000});
    else if(sellPct>=0.9)directionConc.push({code,name:info.name,type:'只卖不买',sellPct:Math.round(sellPct*10000)/10000});
    if(info.termTotal>0){
      const maxTerm=Math.max(...Array.from(info.termMap.values()));
      termConc.push({code,name:info.name,maxTermPct:Math.round(maxTerm/info.termTotal*10000)/10000,topTerm:[...info.termMap.entries()].sort((a,b)=>b[1]-a[1])[0][0]});
    }
  }
  varietyConc.sort((a,b)=>b.maxVarietyPct-a.maxVarietyPct);
  directionConc.sort((a,b)=>b.buyPct-a.buyPct||b.sellPct-a.sellPct);
  termConc.sort((a,b)=>b.maxTermPct-a.maxTermPct);
  return{varietyConc:varietyConc.slice(0,10),directionConc:directionConc.slice(0,10),termConc:termConc.slice(0,10)};
}

function buildLeverageAnalysis(dfPosClean,levRedAccounts){
  const byCode=new Map();
  for(const r of dfPosClean){
    const code=toStr(r._code);
    if(!code||!r._date)continue;
    if(!byCode.has(code))byCode.set(code,[]);
    byCode.get(code).push(r);
  }
  const latest=[];
  const dist={'<100%':0,'100-120%':0,'120-140%':0,'140-200%':0};
  for(const[code,rows]of byCode){
    rows.sort((a,b)=>a._date-b._date);
    const levRows=rows.filter(r=>r._lev!=null&&r._lev>0&&r._lev<=2);
    if(levRows.length===0)continue;
    const last=levRows[levRows.length-1];
    const sorted=levRows.map(r=>r._lev).sort((a,b)=>a-b);
    const med=sorted[Math.floor(sorted.length/2)];
    latest.push({code,name:toStr(last._nameSAC)||code,lev:last._lev,med,date:fmtDate(last._date)});
    const b=last._lev<1?'<100%':last._lev<1.2?'100-120%':last._lev<1.4?'120-140%':'140-200%';
    dist[b]++;
  }
  latest.sort((a,b)=>b.lev-a.lev);
  // 高杠杆Top5账户的杠杆率时序
  const top5=latest.slice(0,5);
  const dateSet=new Set();
  for(const a of top5){for(const r of byCode.get(a.code)){if(r._dateStr&&r._lev!=null&&r._lev>0&&r._lev<=2)dateSet.add(r._dateStr)}}
  const dates=Array.from(dateSet).sort();
  const series=top5.map(a=>({name:a.name,data:(byCode.get(a.code)||[]).filter(r=>r._lev!=null&&r._lev>0&&r._lev<=2&&r._dateStr).map(r=>({date:r._dateStr,lev:Math.round(r._lev*1000)/10}))}));
  // 全市场杠杆率时序：每日 Σ资产总值 ÷ Σ账户规模（只用工作日数据）
  const mktMap=new Map();
  for(const r of dfPosClean){
    if(!(r._size>0)||!(r._total>0)||!r._dateStr)continue;
    if(!r._date||!isChinaWorkday(r._date))continue;
    if(r._lev==null||r._lev<=0||r._lev>2)continue;
    const ex=mktMap.get(r._dateStr)||{size:0,total:0};
    ex.size+=r._size;ex.total+=r._total;
    mktMap.set(r._dateStr,ex);
  }
  const mkt=Array.from(mktMap.entries()).map(([d,v])=>({date:d,lev:Math.round(v.total/v.size*1000)/10})).sort((a,b)=>a.date<b.date?-1:1);
  return{latest:latest.slice(0,15),dist,redAccounts:(levRedAccounts||[]).sort((a,b)=>b.maxLev-a.maxLev),dates,series,mkt};
}

function buildValuationDeviation(dfZqClean){
  // 中债/中证估值偏移：|偏移|>0.5% 进关注清单，>1% 标红；排除所有转债类（品种/类别/名称含"转债"）。原始字段为小数（如0.002=0.2%）
  const rows=[];
  for(const r of dfZqClean){
    if(isConvBond(r))continue;
    const zd=toNum(r['中债估值偏移度(%)'])*100;
    const zz=toNum(r['中证估值偏移度(%)'])*100;
    const mx=Math.max(Math.abs(zd),Math.abs(zz));
    if(mx<=0.5)continue;
    rows.push({date:r._date?fmtDate(r._date):'',code:toStr(r._code),name:toStr(r._name)||toStr(r._code),item:toStr(r._name2),dir:toStr(r._dir),amount:Math.round(r._amountYi*100)/100,zd:Math.round(zd*100)/100,zz:Math.round(zz*100)/100,mx:Math.round(mx*100)/100,red:mx>1,trader:toStr(r['交易员'])});
  }
  rows.sort((a,b)=>b.mx-a.mx);
  const byAcct=new Map();
  for(const r of rows){
    const ex=byAcct.get(r.code)||{code:r.code,name:r.name,count:0,maxDev:0,traders:new Set()};
    ex.count++;ex.maxDev=Math.max(ex.maxDev,r.mx);if(r.trader)ex.traders.add(r.trader);
    byAcct.set(r.code,ex);
  }
  const acctSummary=Array.from(byAcct.values()).map(a=>({code:a.code,name:a.name,count:a.count,maxDev:Math.round(a.maxDev*100)/100,traders:Array.from(a.traders).slice(0,5).join('、')})).sort((a,b)=>b.count-a.count);
  const byItem=new Map();
  for(const r of rows){
    if(!r.item)continue;
    const ex=byItem.get(r.item)||{item:r.item,count:0,accounts:new Set(),maxDev:0};
    ex.count++;ex.accounts.add(r.code);ex.maxDev=Math.max(ex.maxDev,r.mx);
    byItem.set(r.item,ex);
  }
  const itemSummary=Array.from(byItem.values()).filter(x=>x.count>=2).map(x=>({item:x.item,count:x.count,accounts:x.accounts.size,maxDev:Math.round(x.maxDev*100)/100})).sort((a,b)=>b.count-a.count||b.maxDev-a.maxDev).slice(0,20);
  return{rows:rows.slice(0,200),rowsAll:rows,total:rows.length,redCount:rows.filter(r=>r.red).length,acctSummary:acctSummary.slice(0,20),itemSummary};
}

function buildLifecycle(dfPosClean,dfAllTrade){
  const dates=dfPosClean.map(r=>r._date).filter(d=>d);
  if(dates.length===0)return null;
  const[minT,maxT]=minMaxTime(dates);
  const workdays=[];const wdIndex=new Map();
  const d=new Date(minT);
  while(d.getTime()<=maxT){if(isChinaWorkday(d)){const s=fmtDate(d);wdIndex.set(s,workdays.length);workdays.push(s)}d.setDate(d.getDate()+1)}
  if(workdays.length===0)return null;
  const lastIdx=workdays.length-1;
  const lastTrade=new Map();
  for(const r of dfAllTrade){
    if(!r._date)continue;
    const code=toStr(r._code);const t=r._date.getTime();
    if(!lastTrade.has(code)||t>lastTrade.get(code))lastTrade.set(code,t);
  }
  const byCode=new Map();
  for(const r of dfPosClean){
    const code=toStr(r._code);
    if(!code||!r._date)continue;
    if(!byCode.has(code))byCode.set(code,[]);
    byCode.get(code).push(r);
  }
  const counts={'活跃':0,'新开':0,'不活跃':0,'疑似关闭':0};
  const newList=[],inactiveList=[],closedList=[];
  const statusByCode={};
  for(const[code,rows]of byCode){
    rows.sort((a,b)=>a._date-b._date);
    const first=rows[0],last=rows[rows.length-1];
    const name=toStr(last._nameSAC)||code;
    const belong=toStr(last._belong)||toStr(first._belong)||'-';
    const fIdx=wdIndex.has(fmtDate(first._date))?wdIndex.get(fmtDate(first._date)):-1;
    const lIdx=wdIndex.has(fmtDate(last._date))?wdIndex.get(fmtDate(last._date)):-1;
    const isNew=fIdx>5;
    const isClosed=lIdx>=0&&(lastIdx-lIdx)>10;
    const lt=lastTrade.get(code);
    const ltIdx=lt!=null&&wdIndex.has(fmtDate(new Date(lt)))?wdIndex.get(fmtDate(new Date(lt))):null;
    const isInactive=!isClosed&&(ltIdx==null?true:(lastIdx-ltIdx)>10);
    let status;
    if(isClosed)status='疑似关闭';
    else if(isInactive)status='不活跃';
    else if(isNew)status='新开';
    else status='活跃';
    counts[status]++;
    statusByCode[code]=status;
    const rec={code,name,belong,first:fmtDate(first._date),last:fmtDate(last._date),size:Math.round(last._size/1e8*100)/100};
    if(status==='新开')newList.push(rec);
    else if(status==='不活跃')inactiveList.push(rec);
    else if(status==='疑似关闭')closedList.push(rec);
  }
  newList.sort((a,b)=>a.first<b.first?1:-1);
  closedList.sort((a,b)=>a.last<b.last?-1:1);
  inactiveList.sort((a,b)=>b.size-a.size);
  return{counts,newList:newList.slice(0,50),inactiveList:inactiveList.slice(0,50),closedList:closedList.slice(0,50),totals:{newTotal:newList.length,inactiveTotal:inactiveList.length,closedTotal:closedList.length},statusByCode};
}

function buildRepoAnalysis(dfHg,deptByCode){
  const termMap=new Map();const dirMap=new Map();const deptMap=new Map();
  const monthType=new Map();const monthSet=new Set();
  const typeOf=r=>{
    const b=toStr(r._biz);
    if(b.includes('协议'))return'协议回购';
    if(b.includes('通用质押式'))return'通用质押式（交易所）';
    return'质押式回购';
  };
  for(const r of dfHg){
    const t=toStr(r['期限'])||'未知';
    const te=termMap.get(t)||{amount:0,count:0};te.amount+=r._amountYi;te.count++;termMap.set(t,te);
    const d=toStr(r._dir)||'未知';
    const de=dirMap.get(d)||{amount:0,count:0};de.amount+=r._amountYi;de.count++;dirMap.set(d,de);
    // 部门：按 内部证券账户代码 → 持仓规模.账户归属 映射
    const dep=(deptByCode&&deptByCode.get(toStr(r._code)))||'未匹配';
    const pe=deptMap.get(dep)||{amount:0,count:0};pe.amount+=r._amountYi;pe.count++;deptMap.set(dep,pe);
    // 协议/非协议月度趋势
    if(r._month){
      monthSet.add(r._month);
      const ty=typeOf(r);
      if(!monthType.has(ty))monthType.set(ty,new Map());
      const mm=monthType.get(ty);
      mm.set(r._month,(mm.get(r._month)||0)+r._amountYi);
    }
  }
  const days=s=>{const m=String(s).match(/^(\d+)[日天]$/);return m?parseInt(m[1]):9999};
  let terms=Array.from(termMap.entries()).map(([term,v])=>({term,amount:Math.round(v.amount*100)/100,count:v.count})).sort((a,b)=>b.amount-a.amount);
  if(terms.length>10){
    const rest=terms.slice(10);
    terms=terms.slice(0,10);
    terms.push({term:'其他',amount:Math.round(rest.reduce((s,x)=>s+x.amount,0)*100)/100,count:rest.reduce((s,x)=>s+x.count,0)});
  }
  terms.sort((a,b)=>days(a.term)-days(b.term));
  const dirs=Array.from(dirMap.entries()).map(([dir,v])=>({dir,amount:Math.round(v.amount*100)/100,count:v.count})).sort((a,b)=>b.amount-a.amount);
  const depts=Array.from(deptMap.entries()).map(([dept,v])=>({dept,amount:Math.round(v.amount*100)/100,count:v.count})).sort((a,b)=>b.amount-a.amount);
  const months=Array.from(monthSet).sort();
  const monthlySeries=['协议回购','通用质押式（交易所）','质押式回购'].filter(ty=>monthType.has(ty))
    .map(ty=>({name:ty,data:months.map(m=>Math.round((monthType.get(ty).get(m)||0)*100)/100)}));
  // 业务品种环形图（按金额）
  const bizMap=new Map();
  for(const r of dfHg){
    const ty=typeOf(r);
    bizMap.set(ty,(bizMap.get(ty)||0)+r._amountYi);
  }
  const bizData=Array.from(bizMap.entries()).map(([name,value])=>({name,value:Math.round(value*100)/100})).sort((a,b)=>b.value-a.value);
  return{terms,dirs,depts,months,monthlySeries,bizData};
}

// ===== 回购业务：交易员维度（笔数榜 + 月度明细，方向按 正回购/逆回购 前缀拆分，购回/回售计入对应方向）=====
function buildTraderAnalysis(dfHg){
  const map=new Map();const monthSet=new Set();
  for(const r of dfHg){
    const t=toStr(r['交易员'])||'未标注';
    const e=map.get(t)||{name:t,count:0,amount:0,zheng:0,ni:0,months:new Map()};
    e.count++;e.amount+=r._amountYi;
    const d=toStr(r._dir);
    if(d.startsWith('正回购'))e.zheng++;else if(d.startsWith('逆回购'))e.ni++;
    if(r._month){
      monthSet.add(r._month);
      const mm=e.months.get(r._month)||{count:0,amount:0};
      mm.count++;mm.amount+=r._amountYi;e.months.set(r._month,mm);
    }
    map.set(t,e);
  }
  const r2=v=>Math.round(v*100)/100;
  const rows=Array.from(map.values()).map(e=>({name:e.name,count:e.count,amount:r2(e.amount),zheng:e.zheng,ni:e.ni,
    months:Object.fromEntries(Array.from(e.months.entries()).map(([m,v])=>[m,{count:v.count,amount:r2(v.amount)}]))}))
    .sort((a,b)=>b.count-a.count);
  return{rows,months:Array.from(monthSet).sort()};
}

function buildDeptSummary(dfPosClean,dfAllTrade){
  const latestByCode=new Map();
  for(const r of dfPosClean){
    const code=toStr(r._code);
    if(!code||!r._date)continue;
    const ex=latestByCode.get(code);
    if(!ex||r._date>ex._date)latestByCode.set(code,r);
  }
  const stats=new Map();
  const belongOf=code=>{const r=latestByCode.get(code);return r?(toStr(r._belong)||'未标注'):'未标注'};
  for(const[code,r]of latestByCode){
    const b=belongOf(code);
    const ex=stats.get(b)||{accounts:0,size:0,total:0,levSum:0,levN:0,trade:0};
    ex.accounts++;ex.size+=r._size;
    if(r._total>0)ex.total+=r._total;
    if(r._lev!=null&&r._lev>0&&r._lev<=2){ex.levSum+=r._lev;ex.levN++}
    stats.set(b,ex);
  }
  for(const r of dfAllTrade){
    const b=belongOf(toStr(r._code));
    const ex=stats.get(b);
    if(ex)ex.trade+=r._amountYi;
  }
  return Array.from(stats.entries()).map(([dept,v])=>({dept,accounts:v.accounts,size:Math.round(v.size/1e8*100)/100,total:Math.round(v.total/1e8*100)/100,avgLev:v.levN>0?Math.round(v.levSum/v.levN*1000)/10:null,trade:Math.round(v.trade*100)/100})).sort((a,b)=>b.size-a.size);
}

// ===== ABS/REITs 识别（以债券品种列为准，名称兜底）=====
function isABS(r){if(r._class)return r._class==='ABS';const bt=toStr(r._bondType);return bt.includes('资产支持')||bt.toUpperCase().includes('ABS')||toStr(r._name2).toUpperCase().includes('ABS')}
function isREIT(r){if(r._class)return r._class==='REITs';const bt=toStr(r._bondType);return bt.toUpperCase().includes('REIT')||toStr(r._name2).toUpperCase().includes('REIT')}

// ===== 债券表统一品种分类（优先级：期货 > ABS > REITs > 转债 > 基金 > 利率债/信用债）=====
function zqCategory(r){
  if(r._class)return r._class;
  const v=toStr(r._variety),b=toStr(r._biz);
  if(v.includes('期货')||b.includes('期货'))return'期货';
  if(isABS(r))return'ABS';
  if(isREIT(r))return'REITs';
  if(isConvBond(r))return'转债';
  if(v.includes('基金')||b.includes('基金'))return'基金';
  const c=toStr(r._cat);
  if(c==='利率债')return'利率债';
  if(c==='信用债')return'信用债';
  return null;
}

// ===== P2 月度净买入方向（买入-卖出，分品种）=====
function buildNetBuy(dfZqTrade){
  const cats=['利率债','信用债','ABS','REITs','基金','转债'];
  const monthSet=new Set();
  const data={};
  for(const r of dfZqTrade){
    const c=zqCategory(r);const m=r._month;
    if(!c||!cats.includes(c)||!m)continue;
    monthSet.add(m);
    const dir=toStr(r._dir);
    const sign=['买入','分销买入','期货买入'].includes(dir)?1:['卖出','分销卖出','期货卖出'].includes(dir)?-1:0;
    if(sign===0)continue;
    if(!data[c])data[c]=new Map();
    data[c].set(m,(data[c].get(m)||0)+sign*r._amountYi);
  }
  const months=Array.from(monthSet).sort();
  return{months,series:cats.map(c=>({name:c,data:months.map(m=>Math.round((data[c]&&data[c].get(m)||0)*100)/100)}))};
}

function buildVarietyComp(dfHgClean,dfZqTrade){

}

// ===== 持仓健康度：净值最大回撤 / 规模持续缩水 / 净值涨跌排行 =====
function buildPositionHealth(dfPosClean,statusByCode){
  const byCode=new Map();
  for(const r of dfPosClean){
    const code=toStr(r._code);
    if(!code||!r._date)continue;
    if(!byCode.has(code))byCode.set(code,[]);
    byCode.get(code).push(r);
  }
  const drawdowns=[],shrinks=[],navChanges=[];
  for(const[code,rows]of byCode){
    rows.sort((a,b)=>a._date-b._date);
    const name=toStr(rows[rows.length-1]._nameSAC)||code;
    let navs=rows.filter(r=>r._nav!=null&&r._nav>0);
    // 防录错：单日V形尖刺（当天跌>5%且次日恢复到前日98%以上）剔除后再算回撤
    if(navs.length>=3){
      const filtered=[navs[0]];
      for(let i=1;i<navs.length-1;i++){
        const prev=filtered[filtered.length-1]._nav,cur=navs[i]._nav,next=navs[i+1]._nav;
        if((prev-cur)/prev>0.05&&next>=prev*0.98)continue;
        filtered.push(navs[i]);
      }
      filtered.push(navs[navs.length-1]);
      navs=filtered;
    }
    if(navs.length>=2){
      let peak=navs[0]._nav,maxDD=0;
      for(const r of navs){
        if(r._nav>peak)peak=r._nav;
        const dd=(peak-r._nav)/peak;
        if(dd>maxDD)maxDD=dd;
      }
      if(maxDD>0.005)drawdowns.push({code,name,maxDD:Math.round(maxDD*1000)/10,startNav:Math.round(navs[0]._nav*10000)/10000,endNav:Math.round(navs[navs.length-1]._nav*10000)/10000});
      const ch=navs[navs.length-1]._nav/navs[0]._nav-1;
      navChanges.push({code,name,change:Math.round(ch*1000)/10,first:navs[0]._dateStr,last:navs[navs.length-1]._dateStr});
    }
    const sizes=rows.filter(r=>r._size>0);
    if(sizes.length>=2&&(!statusByCode||statusByCode[code]!=='疑似关闭')){
      const maxSize=Math.max(...sizes.map(r=>r._size));
      const lastSize=sizes[sizes.length-1]._size;
      if(maxSize>0&&lastSize/maxSize<0.5){
        shrinks.push({code,name,peak:Math.round(maxSize/1e8*100)/100,last:Math.round(lastSize/1e8*100)/100,ratio:Math.round(lastSize/maxSize*100)});
      }
    }
  }
  drawdowns.sort((a,b)=>b.maxDD-a.maxDD);
  shrinks.sort((a,b)=>a.ratio-b.ratio);
  navChanges.sort((a,b)=>b.change-a.change);
  const gainers=navChanges.filter(x=>x.change>0).slice(0,10);
  const losers=navChanges.filter(x=>x.change<0).sort((a,b)=>a.change-b.change).slice(0,10);
  return{drawdowns:drawdowns.slice(0,10),shrinks,gainers,losers};
}

// ===== FIFO 胜率（期初持仓明细为开仓批，全价差定胜负）+ 期初持仓留存率 =====
function buildFifo(dfZqTrade,hdStart){
  const books=new Map();
  const key=(a,c)=>a+'|'+c;
  const startFace=new Map(); // 账户→期初批总面额（留存率分母）
  for(const h of hdStart.bonds){
    if(!h.acct||!(h.face>0)||!(h.costFull>0))continue;
    const k=key(h.acct,h.code);
    if(!books.has(k))books.set(k,{queue:[],name:h.name,acct:h.acct});
    books.get(k).queue.push({qty:h.face,price:h.costFull,date:null,origin:'start'});
    startFace.set(h.acct,(startFace.get(h.acct)||0)+h.face);
  }
  const trades=dfZqTrade.filter(r=>toStr(r._variety)==='现券买卖'&&r._date).slice().sort((a,b)=>a._date-b._date);
  const trips=[];
  for(const r of trades){
    const acct=toStr(r._code),code=toStr(r['代码']);
    if(!acct||!code)continue;
    const face=toNum(r['交易面额(万)']);
    const price=toNum(r['全价(元)']);
    const dir=toStr(r._dir);
    if(!(face>0)||!(price>0))continue;
    const k=key(acct,code);
    if(dir==='买入'){
      if(!books.has(k))books.set(k,{queue:[],name:toStr(r._name2),acct});
      books.get(k).queue.push({qty:face,price,date:r._date,origin:'in'});
    }else if(dir==='卖出'){
      const book=books.get(k);
      if(!book||book.queue.length===0)continue;
      let remain=face;
      while(remain>1e-9&&book.queue.length>0){
        const lot=book.queue[0];
        const use=Math.min(lot.qty,remain);
        trips.push({acct,code,name:book.name||toStr(r._name2),qty:use,buyPrice:lot.price,sellPrice:price,win:price>lot.price,holdDays:lot.date?Math.max(0,Math.round((r._date-lot.date)/86400000)):null});
        lot.qty-=use;remain-=use;
        if(lot.qty<=1e-9)book.queue.shift();
      }
    }
  }
  const openLots=Array.from(books.values()).reduce((s,b)=>s+b.queue.length,0);
  // 期初持仓留存率：期末仍未平仓的期初批面额 ÷ 期初批总面额（卖出按 FIFO 先冲期初批；买1亿卖5千万→留存50%）
  const retention={};
  {
    const remain=new Map();
    for(const b of books.values()){
      for(const lot of b.queue){
        if(lot.origin==='start'&&lot.qty>1e-9)remain.set(b.acct,(remain.get(b.acct)||0)+lot.qty);
      }
    }
    for(const[a,total]of startFace){
      if(total>0)retention[a]=Math.round((remain.get(a)||0)/total*1000)/10; // 百分比
    }
  }
  const byAcct=new Map();
  for(const t of trips){
    const ex=byAcct.get(t.acct)||{closed:0,wins:0,retNum:0,retDen:0,holdDays:[]};
    ex.closed++;if(t.win)ex.wins++;
    ex.retNum+=(t.sellPrice-t.buyPrice)*t.qty;ex.retDen+=t.buyPrice*t.qty;
    if(t.holdDays!=null)ex.holdDays.push(t.holdDays);
    byAcct.set(t.acct,ex);
  }
  const accounts=[];const map={};
  for(const[code,a]of byAcct){
    if(a.closed<3)continue;
    a.holdDays.sort((x,y)=>x-y);
    const rec={code,closed:a.closed,wins:a.wins,winRate:Math.round(a.wins/a.closed*1000)/10,avgRet:a.retDen>0?Math.round(a.retNum/a.retDen*10000)/100:0,avgHold:a.holdDays.length?a.holdDays[Math.floor(a.holdDays.length/2)]:null};
    accounts.push(rec);map[code]=rec;
  }
  accounts.sort((a,b)=>b.closed-a.closed||b.winRate-a.winRate); // 排名以闭合笔数为主
  return{accounts,totalTrips:trips.length,openLots,map,retention};
}

// ===== 账户身份：固收+/纯债 + 配置/交易/混合 =====
function buildAccountIdentity(dfZqTrade,hdStart,hdEnd,fifo,dfPosClean,activeCodes){
  const RATE=RATE_TYPES,CONV=CONV_TYPES,ABS=ABS_TYPES;
  // typeAt：返回账户→{conv,fund,reit} 标记；市值=0跳过，负市值（看空）计入
  const typeAt=hd=>{
    const m=new Map();
    for(const b of hd.bonds){
      if(!b.mv)continue; // 市值=0 才跳过；负市值（看空/做空）也参与固收+判定
      const e=m.get(b.acct)||{conv:false,fund:false,reit:false};
      if(CONV.has(b.bondType))e.conv=true;
      m.set(b.acct,e);
    }
    for(const f of hd.funds){
      if(!f.mv)continue; // 同上：负市值计入判定
      const e=m.get(f.acct)||{conv:false,fund:false,reit:false};
      if(f.kind==='REITs')e.reit=true;
      else if(f.kind.includes('ETF')||f.kind.includes('基金'))e.fund=true;
      m.set(f.acct,e);
    }
    return m;
  };
  const flagType=e=>(e.conv||e.fund||e.reit)?'固收+':'纯债';
  const flagsEnd=typeAt(hdEnd),flagsStart=typeAt(hdStart);
  const typeEnd=new Map(),typeStart=new Map();
  for(const[a,e]of flagsEnd)typeEnd.set(a,flagType(e));
  for(const[a,e]of flagsStart)typeStart.set(a,flagType(e));
  // 期末市值 & 浮动盈亏（账户级）
  const endMV=new Map(),floatPnl=new Map(),realPnl=new Map();
  for(const b of hdEnd.bonds){endMV.set(b.acct,(endMV.get(b.acct)||0)+b.mv);floatPnl.set(b.acct,(floatPnl.get(b.acct)||0)+b.floatPnl);realPnl.set(b.acct,(realPnl.get(b.acct)||0)+b.realPnl)}
  for(const f of hdEnd.funds){endMV.set(f.acct,(endMV.get(f.acct)||0)+f.mv);floatPnl.set(f.acct,(floatPnl.get(f.acct)||0)+f.floatPnl);realPnl.set(f.acct,(realPnl.get(f.acct)||0)+f.realPnl)}
  // 兜底分母：无期末持仓明细的账户用最新持仓规模
  const latestSize=new Map();
  for(const r of dfPosClean){
    const c=toStr(r._code);if(!c||!r._date)continue;
    const ex=latestSize.get(c);
    if(!ex||r._date>ex)latestSize.set(c,r._date);
  }
  const sizeMap=new Map();
  for(const r of dfPosClean){
    const c=toStr(r._code);
    if(c&&latestSize.get(c)===r._date)sizeMap.set(c,r._size/1e4); // 元→万元
  }
  // 流量信号
  const flow=new Map();
  const codeSets=new Map();
  for(const r of dfZqTrade){
    const a=toStr(r._code);if(!a)continue;
    const ex=flow.get(a)||{buy:0,sell:0};
    const d=toStr(r._dir);
    if(['买入','分销买入','期货买入'].includes(d))ex.buy+=r._amountYi;
    else if(['卖出','分销卖出','期货卖出'].includes(d))ex.sell+=r._amountYi;
    flow.set(a,ex);
    if(!codeSets.has(a))codeSets.set(a,{both:new Set(),all:new Set(),dirs:new Map()});
    const cs=codeSets.get(a);const bc=toStr(r['代码']);
    if(bc){cs.all.add(bc);cs.dirs.set(bc,(cs.dirs.get(bc)||0)|(d.includes('买')?1:2));if(cs.dirs.get(bc)===3)cs.both.add(bc)}
  }
  // 流量信号：有无转债/基金/REITs 交易（无持仓明细账户的固收+兜底判定：有相关交易即为固收+）
  const altShare=new Map();
  for(const r of dfZqTrade){
    const a=toStr(r._code);if(!a)continue;
    const c=zqCategory(r);
    const ex=altShare.get(a)||{alt:0,total:0,conv:false,fund:false,reit:false};
    ex.total+=r._amountYi;
    if(c==='转债'){ex.alt+=r._amountYi;ex.conv=true}
    else if(c==='基金'){ex.alt+=r._amountYi;ex.fund=true}
    else if(c==='REITs'){ex.alt+=r._amountYi;ex.reit=true}
    altShare.set(a,ex);
  }
  // 账户全集：回购池+债券池全部记录（含非交易量品种）代码去重
  const allCodes=new Set(activeCodes?[...activeCodes]:[...flow.keys(),...endMV.keys(),...typeEnd.keys()]);
  const idMap={};
  for(const code of allCodes){
    // 固收+/纯债：期末持仓明细优先；无持仓明细的账户，只要有转债/基金/REITs 交易即固收+
    let type=typeEnd.get(code);
    if(!type){
      const sh=altShare.get(code);
      type=sh&&sh.alt>0?'固收+':'纯债';
    }
    // 风格
    const f=flow.get(code)||{buy:0,sell:0};
    const mv=endMV.get(code)||sizeMap.get(code)||0;
    const totalAmt=f.buy+f.sell;
    const turnover=mv>0?totalAmt*1e4/mv:null; // 亿→万元÷万元
    const avgHold=fifo.map[code]?fifo.map[code].avgHold:null;
    // 买卖双向率：期内既有买入又有卖出的标的数 ÷ 交易过的标的总数（交易型佐证信号）
    const cs=codeSets.get(code);
    const bothRatio=cs&&cs.all.size>0?cs.both.size/cs.all.size:null;
    let style='混合型';
    if(turnover!=null){
      if(turnover>1||(avgHold!=null&&avgHold<20))style='交易型';
      else if(turnover<0.3&&(avgHold==null||avgHold>90))style='配置型';
    }
    idMap[code]={type,style,turnover:turnover!=null?Math.round(turnover*100)/100:null,avgHold,bothRatio:bothRatio!=null?Math.round(bothRatio*1000)/10:null,endMV:Math.round((endMV.get(code)||0)/1e4*100)/100,floatPnl:Math.round((floatPnl.get(code)||0)/1e4*100)/100,realPnl:Math.round((realPnl.get(code)||0)/1e4*100)/100};
  }
  // 期初/期末截面计数与固收+构成：统一账户全集口径；持仓优先，无持仓看交易
  const typeCounts={start:{'固收+':0,'纯债':0},end:{'固收+':0,'纯债':0}};
  const endComp={conv:0,fund:0,reit:0};
  for(const code of allCodes){
    const tE=idMap[code].type;
    typeCounts.end[tE]++;
    // 期初：期初持仓优先，无期初持仓用交易兜底
    let tS=typeStart.get(code);
    if(!tS){const sh=altShare.get(code);tS=sh&&sh.alt>0?'固收+':'纯债'}
    typeCounts.start[tS]++;
    // 固收+构成（期末截面，账户可重叠）：持仓标记优先，无持仓用交易标记
    if(tE==='固收+'){
      const fl=flagsEnd.get(code)||altShare.get(code);
      if(fl){if(fl.conv)endComp.conv++;if(fl.fund)endComp.fund++;if(fl.reit)endComp.reit++}
    }
  }
  return{idMap,typeCounts,endComp,universe:allCodes.size};
}

// ===== 配置/交易/混合：多维打分模型（权重与分段阈值可调）=====
// 五个信号（越像交易型分越高）：真实换手率、平均持有天数（反向）、期初持仓留存率（反向）、交易天数占比、买卖双向率
// 缺失信号自动跳过，其余信号权重归一；无任一信号的账户不出判定
const STYLE_CFG={
  weights:{turnover:0.25,hold:0.20,retention:0.20,days:0.20,both:0.15}, // 权重合计=1
  norm:{turnoverFull:2,holdFull:180,daysFull:0.5}, // 归一化基准：换手≥2、持有≥180天→0分、交易天数占比≥50% 记满分
  tradeMin:60,configMax:30 // 得分≥60 交易型，≤30 配置型，其余混合型
};
function buildStyleScores(idMap,retention,dfAll){
  // 交易天数占比：有交易的 distinct 工作日 ÷ 数据区间工作日总数
  const daySet=new Map();let minT=null,maxT=null;
  for(const r of dfAll){
    const c=toStr(r._code);if(!c||!r._date)continue;
    const t=r._date.getTime();
    if(minT==null||t<minT)minT=t;if(maxT==null||t>maxT)maxT=t;
    if(!daySet.has(c))daySet.set(c,new Set());
    daySet.get(c).add(r._dateStr);
  }
  let workdays=0;
  if(minT!=null){const d=new Date(minT);while(d.getTime()<=maxT){if(isChinaWorkday(d))workdays++;d.setDate(d.getDate()+1)}}
  const N=STYLE_CFG.norm,W=STYLE_CFG.weights;
  const out={};
  for(const code of Object.keys(idMap)){
    const id=idMap[code];
    const sigs={};
    if(id.turnover!=null)sigs.turnover=Math.min(id.turnover/N.turnoverFull,1);
    if(id.avgHold!=null)sigs.hold=Math.max(0,1-id.avgHold/N.holdFull);
    if(retention&&retention[code]!=null)sigs.retention=1-retention[code]/100;
    const ds=daySet.get(code);
    if(ds&&workdays>0)sigs.days=Math.min(ds.size/workdays/N.daysFull,1);
    if(id.bothRatio!=null)sigs.both=id.bothRatio/100;
    const keys=Object.keys(sigs);
    const raw={turnover:id.turnover,avgHold:id.avgHold,retention:retention&&retention[code]!=null?retention[code]:null,
      days:ds&&workdays>0?Math.round(ds.size/workdays*1000)/10:null,both:id.bothRatio};
    if(keys.length===0){out[code]={score:null,style:null,sigs,raw};continue}
    let wSum=0,acc=0;
    for(const k of keys){acc+=sigs[k]*W[k];wSum+=W[k]}
    const score=Math.round(acc/wSum*1000)/10;
    out[code]={score,style:score>=STYLE_CFG.tradeMin?'交易型':(score<=STYLE_CFG.configMax?'配置型':'混合型'),sigs,raw};
  }
  return out;
}

// ===== 持仓分析（期末横截面，描述性）=====
function buildHoldingsAnalysis(hdEnd){
  const acctMap=new Map();
  const get=a=>{if(!acctMap.has(a))acctMap.set(a,{code:a,name:'',bondMV:0,fundMV:0,floatPnl:0,realPnl:0,face:0});return acctMap.get(a)};
  const comp={}; // 类别市值
  const add=(cat,mv)=>{comp[cat]=Math.round(((comp[cat]||0)+mv)*100)/100};
  for(const b of hdEnd.bonds){
    const a=get(b.acct);
    if(!a.name)a.name=b.acct;
    a.bondMV+=b.mv;a.face+=b.face;a.floatPnl+=b.floatPnl;a.realPnl+=b.realPnl;
    let cat;
    if(b.assetType==='资产证券化产品'||ABS_TYPES.has(b.bondType))cat='ABS';
    else if(CONV_TYPES.has(b.bondType))cat='转债';
    else if(RATE_TYPES.has(b.bondType))cat='利率债';
    else if(b.bondType)cat='信用债';
    else cat='其他';
    add(cat,b.mv);
  }
  for(const f of hdEnd.funds){
    const a=get(f.acct);
    a.fundMV+=f.mv;a.floatPnl+=f.floatPnl;a.realPnl+=f.realPnl;
    const cat=f.kind==='REITs'?'REITs':(f.kind.includes('ETF')||f.kind.includes('基金')?'基金':'其他');
    add(cat,f.mv);
  }
  const accounts=Array.from(acctMap.values()).map(a=>({...a,mv:Math.round((a.bondMV+a.fundMV)*100)/100,floatPnl:Math.round(a.floatPnl*100)/100,realPnl:Math.round(a.realPnl*100)/100}));
  accounts.sort((x,y)=>y.mv-x.mv);
  const byPnl=[...accounts].sort((x,y)=>y.floatPnl-x.floatPnl);
  const compData=Object.entries(comp).filter(([,v])=>v>0).map(([name,value])=>({name,value:Math.round(value/1e4*100)/100})).sort((a,b)=>b.value-a.value);
  const topAcct=accounts.slice(0,20).map(a=>({code:a.code,name:a.name,mv:Math.round(a.mv/1e4*100)/100,face:Math.round(a.face/1e4*100)/100,floatPnl:Math.round(a.floatPnl/1e4*100)/100,realPnl:Math.round(a.realPnl/1e4*100)/100}));
  return{
    accounts:topAcct,
    compData,
    gainers:byPnl.filter(a=>a.floatPnl>0).slice(0,10).map(a=>({code:a.code,name:a.name,pnl:Math.round(a.floatPnl/1e4*100)/100})),
    losers:byPnl.filter(a=>a.floatPnl<0).sort((a,b)=>a.floatPnl-b.floatPnl).slice(0,10).map(a=>({code:a.code,name:a.name,pnl:Math.round(a.floatPnl/1e4*100)/100})),
    futures:hdEnd.futures.filter(f=>f.qty!==0||f.margin!==0),
    funds:hdEnd.funds.filter(f=>f.mv!==0).sort((a,b)=>Math.abs(b.mv)-Math.abs(a.mv)).slice(0,50),
    hasData:hdEnd.bonds.length>0||hdEnd.funds.length>0
  };
}

// ===== 账户画像总表数据层（五大类+回购拆分+主营标签）=====
const profileState={month:'all',sortCol:null,sortAsc:false};
function profileRows(month){
  const r=currentResult;
  if(!r||!r._store)return[];
  const accts=new Map();
  const get=code=>{
    if(!accts.has(code))accts.set(code,{code,name:'',fund:0,xyLong:0,xyShort:0,llLong:0,llShort:0,conv:0,abs:0,reit:0,qh:0,xyhg:0,zyhg:0,size:null,tradeTotal:0,tag:'综合型',fxBuy:0,buyAll:0});
    return accts.get(code);
  };
  for(const x of r._store.zq){
    if(month!=='all'&&x._month!==month)continue;
    const code=toStr(x._code);
    if(!code)continue;
    const a=get(code);
    if(!a.name)a.name=toStr(x._name);
    const amt=x._amountYi;
    const d0=toStr(x._dir);
    if(d0==='买入'||d0==='分销买入'){a.buyAll+=amt;if(d0==='分销买入')a.fxBuy+=amt} // 一级参与度：分销买入 ÷ 总买入
    const v=toStr(x._variety),b=toStr(x._biz);
    if(v.includes('期货')||b.includes('期货')){a.qh+=amt;continue}
    if(isABS(x)){a.abs+=amt;continue}
    if(isREIT(x)){a.reit+=amt;continue}
    if(isConvBond(x)){a.conv+=amt;continue}
    if(v.includes('基金')||b.includes('基金')){a.fund+=amt;continue}
    const cat=toStr(x._cat);
    const isLong=x._term!=null&&x._term>=10;
    if(cat==='信用债'){if(isLong)a.xyLong+=amt;else a.xyShort+=amt}
    else if(cat==='利率债'){if(isLong)a.llLong+=amt;else a.llShort+=amt}
  }
  for(const x of r._store.hg){
    if(month!=='all'&&x._month!==month)continue;
    const code=toStr(x._code);
    if(!code)continue;
    const a=get(code);
    if(!a.name)a.name=toStr(x._name);
    if(toStr(x._biz).includes('协议'))a.xyhg+=x._amountYi;else a.zyhg+=x._amountYi;
  }
  const latest=new Map();
  for(const p of r._store.pos){
    const code=toStr(p._code);
    if(!code||!p._date)continue;
    const ex=latest.get(code);
    if(!ex||p._date>ex._date)latest.set(code,p);
  }
  for(const[code,p]of latest){
    const a=accts.get(code);
    if(a){a.size=Math.round(p._size/1e8*100)/100;if(!a.name)a.name=toStr(p._nameSAC)}
  }
  for(const a of accts.values()){
    const cats={'基金型':a.fund,'长债型':a.xyLong+a.llLong,'债券型':a.xyShort+a.llShort,'转债型':a.conv,'另类型':a.abs+a.reit+a.qh};
    const total=Object.values(cats).reduce((s,x)=>s+x,0);
    if(total>0){
      const[bestTag,bestVal]=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
      if(bestVal/total>0.4)a.tag=bestTag;
    }
    a.tradeTotal=total+a.xyhg+a.zyhg;
    a.primaryPct=a.buyAll>0?Math.round(a.fxBuy/a.buyAll*1000)/10:null;
    // 身份（固收+/纯债、风格）与 FIFO 胜率
    const id=r.identity&&r.identity.idMap?r.identity.idMap[a.code]:null;
    a.type=id?id.type:null;
    a.style=id?id.style:null;
    a.turnoverX=id?id.turnover:null;
    a.avgHold=id?id.avgHold:null;
    a.endMV=id&&id.endMV>0?id.endMV:null;
    a.floatPnl=id?id.floatPnl:null;
    const ff=r.fifo&&r.fifo.map?r.fifo.map[a.code]:null;
    a.winRate=ff?ff.winRate:null;
    a.closedTrips=ff?ff.closed:0;
  }
  const out=Array.from(accts.values());
  if(month==='all'){
    profileState.tagMap=new Map(out.map(a=>[a.code,a.tag]));
    profileState.nameMap=new Map(out.map(a=>[a.code,a.name]));
  }
  return out;
}
const PROFILE_COLS=[['code','账户代码'],['name','账户名称'],['size','持仓规模(亿)'],['tag','主营标签'],['type','类型'],['style','风格'],['winRate','胜率%'],['endMV','期末市值(亿)'],['floatPnl','浮动盈亏(亿)'],['turnoverX','真实换手率'],['avgHold','平均持有(天)'],['primaryPct','一级占比%'],['fund','基金'],['xyLong','信用债-长久期'],['xyShort','信用债-非长久期'],['llLong','利率债-长久期'],['llShort','利率债-非长久期'],['conv','转债'],['abs','ABS'],['reit','REITs'],['qh','国债期货'],['xyhg','协议回购'],['zyhg','质押式回购']];
function tagBadge(tag){
  const cls={'另类型':'badge-amber','综合型':'badge-gray','基金型':'badge-blue','转债型':'badge-blue','长债型':'badge-green','债券型':'badge-green'}[tag]||'badge-gray';
  return`<span class="badge ${cls}">${tag}</span>`;
}
function typeBadge(t){return t?`<span class="badge ${t==='固收+'?'badge-blue':'badge-green'}">${t}</span>`:'-'}
function styleBadge(s){return s?`<span class="badge ${{交易型:'badge-amber',配置型:'badge-green',混合型:'badge-gray'}[s]||'badge-gray'}">${s}</span>`:'-'}
function profileTableHtml(){
  const rows=profileRows(profileState.month);
  if(profileState.sortCol!=null){
    const key=PROFILE_COLS[profileState.sortCol][0];
    rows.sort((x,y)=>{
      const a=x[key],b=y[key];
      if(typeof a==='string'||typeof b==='string')return profileState.sortAsc?String(a).localeCompare(String(b),'zh'):String(b).localeCompare(String(a),'zh');
      return profileState.sortAsc?(a||0)-(b||0):(b||0)-(a||0);
    });
  }else rows.sort((a,b)=>b.tradeTotal-a.tradeTotal);
  const headers=PROFILE_COLS.map(([key,label],i)=>`<span class="th-sort" onclick="sortProfile(${i})">${label}${profileState.sortCol===i?(profileState.sortAsc?' ↑':' ↓'):''}</span>`);
  const yi=v=>v>0?Math.round(v*100)/100:'-';
  const tableRows=rows.map(a=>{
    const row=[`<span class="font-mono">${a.code}</span>`,a.name,a.size!=null?a.size:'-',tagBadge(a.tag),typeBadge(a.type),styleBadge(a.style),
      a.winRate!=null?a.winRate:'-',yi(a.endMV),a.floatPnl!=null?a.floatPnl:'-',a.turnoverX!=null?a.turnoverX:'-',a.avgHold!=null?a.avgHold:'-',a.primaryPct!=null?a.primaryPct:'-',
      yi(a.fund),yi(a.xyLong),yi(a.xyShort),yi(a.llLong),yi(a.llShort),yi(a.conv),yi(a.abs),yi(a.reit),yi(a.qh),yi(a.xyhg),yi(a.zyhg)];
    row._code=a.code;
    return row;
  });
  return renderPaginatedTable('profile',headers,tableRows,{rowClick:row=>`showAccountProfile('${row._code}')`});
}
function sortProfile(i){
  if(profileState.sortCol===i)profileState.sortAsc=!profileState.sortAsc;
  else{profileState.sortCol=i;profileState.sortAsc=false}
  refreshProfileTable();
}
function refreshProfileTable(){
  const el=document.getElementById('profileTableWrap');
  if(el)el.innerHTML=profileTableHtml();
}


function runAnalysis(rawHg,rawZq,rawPos,hdStart,hdEnd,salesDropped){
  const dfHg=preprocessHg(rawHg);
  const dfZq=preprocessZq(rawZq);
  const dfPos=preprocessPosition(rawPos);
  // 分类映射：期末持仓明细精准匹配 → 旧格式自带列 → 标"其他"
  const classMap=buildClassMap(hdEnd);
  const classResult=applyClassification(dfZq,classMap);
  // 数据质量过滤：命中「过滤」规则的记录从所有统计中剔除，在「数据质量」页留痕
  const dq=applyDataQuality(dfHg,dfZq,dfPos);
  const dfHgClean=dq.hgClean;
  const dfZqClean=dq.zqClean;
  const dfPosClean=dq.posClean;
  // 交易量口径：仅现券买卖、基金买卖、国债期货
  const dfZqTrade=dfZqClean.filter(r=>TRADE_VARIETIES.has(toStr(r._variety)));
  const posFillResult=fillPositionGaps(dfPosClean);
  const dfPosFilled=posFillResult.filled;
  const posMissingReport=posFillResult.missingReport;
  const dfAll=[...dfHgClean,...dfZqClean];
  const dfAllTrade=[...dfHgClean,...dfZqTrade];
  const activeCodesSet=new Set();
  for(const r of dfAll){if(toStr(r._code))activeCodesSet.add(toStr(r._code))}

  const hgTop10=getTop10(dfHgClean);
  const bondTop10=getTop10(dfZqTrade); // 总览「债券交易金额 Top5」：全部债券业务（交易量口径）
  const xyhg=dfHgClean.filter(r=>toStr(r._biz).includes('协议'));
  const xyhgTop10=getTop10(xyhg);
  const longTerm=dfZqTrade.filter(r=>r._termBucket==='10-30年'||r._termBucket==='30年+');
  const longTermTop10=getTop10(longTerm);
  const fundDf=dfZqTrade.filter(r=>toStr(r._biz).includes('基金')||toStr(r._variety).includes('基金'));
  const fundTop10=getTop10(fundDf);
  const zqDf=dfZqTrade.filter(r=>toStr(r._biz).includes('转债')||toStr(r._bondType).includes('转债')||toStr(r._cat).includes('转债'));
  const zqTop10=getTop10(zqDf);
  const qhDf=dfZqTrade.filter(r=>toStr(r._biz).includes('期货')||toStr(r._variety).includes('期货'));
  const qhTop10=getTop10(qhDf);
  const absDf=dfZqTrade.filter(r=>isABS(r));
  const reitDf=dfZqTrade.filter(r=>isREIT(r));
  const absTop10=getTop10(absDf);
  const reitTop10=getTop10(reitDf);

  // 重点账户深度分析：按类别分板块，各取金额 Top5
  const deepByCat=[];
  const analysisCache=new Map();
  const getAnalysis=code=>{
    if(!analysisCache.has(code)){
      const name=toStr(dfZqTrade.find(r=>toStr(r._code)===code)?._name)||code;
      analysisCache.set(code,analyzeBondAccount(dfZqTrade,code,name));
    }
    return analysisCache.get(code);
  };
  for(const[catName,top]of[['长期债券',longTermTop10],['基金',fundTop10],['可转债',zqTop10],['国债期货',qhTop10],['ABS',absTop10],['REITs',reitTop10]]){
    const accounts=top.byValue.slice(0,5).map(a=>getAnalysis(a.code));
    if(accounts.length>0)deepByCat.push({catName,accounts});
  }

  const monthlyTrend=buildMonthlyTrend(dfHgClean,dfZqTrade);
  const termStructure=buildTermStructure(dfZqTrade);
  const anomalies=detectAnomalies(dfAll,dq.scaleMap);
  const lowActivity=buildLowActivity(dfAll);
  const posOverview=buildPositionOverview(dfPosFilled,activeCodesSet);
  const posTimeSeries=buildPositionTimeSeries(dfPosFilled,activeCodesSet);
  const lifecycle=buildLifecycle(dfPosClean,dfAllTrade);
  const posHealth=buildPositionHealth(dfPosClean,lifecycle?lifecycle.statusByCode:null);
  const sizeCategory=buildSizeCategoryAnalysis(dfZqTrade,dfPosFilled,activeCodesSet);
  const turnoverAnalysis=buildTurnoverAnalysis(dfZqTrade,dfPosFilled,activeCodesSet);
  const concentration=buildConcentrationAnalysis(dfZqTrade);
  const leverage=buildLeverageAnalysis(dfPosClean,dq.levRedAccounts);
  const valuation=buildValuationDeviation(dfZqClean);
  // 部门映射：内部证券账户代码 → 持仓规模.账户归属（取该账户最新一条记录的归属）
  const deptByCode=new Map();
  {
    const latest=new Map();
    for(const r of dfPosClean){const c=toStr(r._code);if(!c||!r._date)continue;const ex=latest.get(c);if(!ex||r._date>ex)latest.set(c,r)}
    for(const[c,r]of latest){const b=toStr(r._belong);if(b)deptByCode.set(c,b)}
  }
  const repoAnalysis=buildRepoAnalysis(dfHgClean,deptByCode);
  const traderAnalysis=buildTraderAnalysis(dfHgClean);
  const deptSummary=buildDeptSummary(dfPosClean,dfAllTrade);
  const netBuy=buildNetBuy(dfZqTrade);
  const varietyComp=buildVarietyComp(dfHgClean,dfZqTrade);
  const monthlyActive=buildMonthlyActiveAccounts(dfAll);
  const hotItems=buildHotItems(dfZqTrade);
  const bondTypeComp=buildBondTypeComp(dfZqTrade);
  // 持仓明细驱动的新分析
  const fifo=buildFifo(dfZqTrade,hdStart);
  const identity=buildAccountIdentity(dfZqTrade,hdStart,hdEnd,fifo,dfPosClean,activeCodesSet);
  // 多维打分：覆盖 idMap 中的 style 为模型判定结果
  const styleScores=buildStyleScores(identity.idMap,fifo.retention,dfAll);
  for(const code of Object.keys(identity.idMap)){
    const s=styleScores[code];
    if(s&&s.style){identity.idMap[code].style=s.style;identity.idMap[code].styleScore=s.score}
    else if(s){identity.idMap[code].style=null;identity.idMap[code].styleScore=null}
  }
  const holdingsAnalysis=buildHoldingsAnalysis(hdEnd);

  const totalHg=dfHgClean.length;
  const totalZq=dfZqTrade.length;
  const totalAccounts=activeCodesSet.size;
  const hgAmount=Math.round(dfHgClean.reduce((s,r)=>s+r._amountYi,0)*10000)/10000;
  const zqAmount=Math.round(dfZqTrade.reduce((s,r)=>s+r._amountYi,0)*10000)/10000;
  const totalAmount=Math.round((hgAmount+zqAmount)*10000)/10000;
  const dqFiltered=dq.dqReport.filter(b=>b.level==='过滤').reduce((s,b)=>s+b.rows.length,0);
  const summary={totalHg,totalZq,totalAccounts,totalAmount,hgAmount,zqAmount,dqFiltered,hasPosition:dfPosClean.length>0&&posOverview.hasData};

  return{
    summary,hgTop10,bondTop10,xyhgTop10,longTermTop10,fundTop10,zqTop10,qhTop10,absTop10,reitTop10,traderAnalysis,styleScores,
    deepByCat,monthlyTrend,termStructure,anomalies,lowActivity,
    posOverview,posTimeSeries,posHealth,sizeCategory,posMissingReport,
    turnoverAnalysis,concentration,repoAnalysis,deptSummary,netBuy,
    varietyComp,monthlyActive,hotItems,bondTypeComp,
    fifo,identity,holdingsAnalysis,
    dataQuality:dq.dqReport,leverage,valuation,lifecycle,
    inputInfo:{salesDropped:salesDropped||0,unmapped:classResult.unmapped,unmappedCodes:classResult.unmappedCodes,hdStartLabel:hdStart.label,hdEndLabel:hdEnd.label,hdStartDate:hdStart.dateStr,hdEndDate:hdEnd.dateStr},
    _store:{hg:dfHgClean,zq:dfZqTrade,zqAll:dfZqClean,pos:dfPosClean}
  };
}

  const tabs=[{id:'overview',label:'总览'},{id:'hg',label:'回购业务'},{id:'type',label:'类型判定'},{id:'behavior',label:'交易行为'},{id:'eval',label:'做得怎么样'},{id:'risk',label:'风险监控'},{id:'dq',label:'数据质量'}];
  const bar=document.getElementById('tabBar');
  bar.innerHTML=tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  bar.querySelectorAll('.tab').forEach(btn=>{btn.addEventListener('click',()=>switchTab(btn.dataset.tab))});
}

function switchTab(tabId){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tabId));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id===`tab-${tabId}`));
  setTimeout(()=>{document.querySelectorAll(`#tab-${tabId} .chart, #tab-${tabId} .chart-large`).forEach(el=>{const chart=echarts.getInstanceByDom(el);if(chart)chart.resize()})},50);
}

function renderTable(headers,rows,options={}){
  if(rows.length===0)return'<div class="empty-state">暂无数据</div>';
  const{rowClass,rowClick}=options;
  let html='<div class="table-container"><table><thead><tr>';
  for(const h of headers)html+=`<th>${h}</th>`;
  html+='</tr></thead><tbody>';
  for(const row of rows){
    const rc=rowClass?rowClass(row):'';
    const clk=rowClick?` onclick="${rowClick(row)}" style="cursor:pointer"`:'';
    html+=`<tr class="${rc}"${clk}>`;
    for(const cell of row){
      if(typeof cell==='number'){html+=Number.isInteger(cell)?`<td class="text-right">${cell.toLocaleString()}</td>`:`<td class="text-right">${cell.toFixed(2)}</td>`}
      else html+=`<td>${cell}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  return html;
}

// ===== 分页表格：每页20行，左下总条数，右下翻页器 =====
const tableStore={};
function renderPaginatedTable(id,headers,rows,options={}){
  tableStore[id]={headers,rows,options,page:1};
  return`<div id="pt-${id}">${renderTablePage(id)}</div>`;
}
function renderTablePage(id){
  const st=tableStore[id];
  if(!st)return'';
  const per=st.options.per||20;
  const total=st.rows.length;
  const pages=Math.max(1,Math.ceil(total/per));
  if(st.page>pages)st.page=pages;
  const slice=st.rows.slice((st.page-1)*per,st.page*per);
  let html=renderTable(st.headers,slice,st.options);
  if(total>per){
    let btns='';
    const win=[];
    for(let p=1;p<=pages;p++){if(p===1||p===pages||Math.abs(p-st.page)<=2)win.push(p)}
    let last=0;
    for(const p of win){if(p-last>1)btns+='<span style="margin:0 4px;color:#94a3b8">…</span>';btns+=`<button class="${p===st.page?'cur':''}" onclick="gotoPage('${id}',${p})">${p}</button>`;last=p}
    html+=`<div class="pager"><div>共 ${total.toLocaleString()} 条 · 第 ${st.page}/${pages} 页</div><div class="pager-btns"><button ${st.page===1?'disabled':''} onclick="gotoPage('${id}',${st.page-1})">上一页</button>${btns}<button ${st.page===pages?'disabled':''} onclick="gotoPage('${id}',${st.page+1})">下一页</button></div></div>`;
  }else{
    html+=`<div class="pager"><div>共 ${total.toLocaleString()} 条</div><div></div></div>`;
  }
  return html;
}
function gotoPage(id,p){
  const st=tableStore[id];
  if(!st)return;
  st.page=p;
  const el=document.getElementById('pt-'+id);
  if(el)el.innerHTML=renderTablePage(id);
}

function onTraderFilter(name){
  const ta=currentResult&&currentResult.traderAnalysis;

  if(!name){
    wrap.innerHTML=t(ta.rows);

  const row=ta.rows.find(x=>x.name===name);
  wrap.innerHTML=row?t([row]):'';

    const mrows=ta.months.filter(m=>row.months[m]).map(m=>[m,row.months[m].count,row.months[m].amount]);

function renderTypeTab(r){
